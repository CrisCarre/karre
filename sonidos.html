<title>Botonera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Metal+Mania&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c451;--gold-dark:#8a5a12}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cinzel',serif;color:#fff;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(ellipse at 50% 30%,rgba(160,25,5,.55) 0%,rgba(40,4,2,.9) 45%,#050101 80%),radial-gradient(circle at 50% 110%,rgba(255,90,0,.35),transparent 50%),#050101;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;background-image:radial-gradient(circle at 50% 0,transparent 55%,#ff9a3c 57%,transparent 62%);background-size:34px 22px}
#embers{position:fixed;inset:0;pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:60px 16px 90px}
.title{font-family:'Metal Mania',cursive;font-weight:400;text-align:center;line-height:1;font-size:clamp(2.4rem,7vw,4.4rem);letter-spacing:2px;
  background:linear-gradient(180deg,#fff6c2 0%,#ffc53d 35%,#ff5a00 70%,#a80f07 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,80,0,.75)) drop-shadow(0 3px 0 #2a0402)}
.subtitle{margin-top:6px;color:var(--gold);letter-spacing:6px;text-transform:uppercase;font-size:clamp(.75rem,2vw,1rem);text-shadow:0 0 10px rgba(255,120,0,.8);text-align:center}
.back{position:fixed;top:14px;left:14px;z-index:20;font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;letter-spacing:2px;text-decoration:none;color:#ffe3a0;
  padding:9px 18px;border-radius:30px;border:2px solid var(--gold-dark);background:rgba(20,4,2,.85);transition:.2s}
.back:hover{border-color:var(--gold);color:#fff;box-shadow:0 0 12px rgba(255,150,0,.6)}
.corner{position:fixed;right:14px;bottom:14px;z-index:20}
.corner button{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold-dark);background:rgba(20,4,2,.85);font-size:1.2rem;cursor:pointer;transition:.2s}
.corner button:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(255,150,0,.6)}
body.obs .corner,body.obs .back{display:none}
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
.modal.show{display:flex}
.card{position:relative;background:linear-gradient(180deg,#2a0704,#120302);border:2px solid var(--gold);border-radius:18px;padding:26px;
  box-shadow:0 0 40px rgba(255,80,0,.5),inset 0 0 30px rgba(0,0,0,.8);width:100%;max-width:440px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.card h2{font-family:'Metal Mania',cursive;font-weight:400;font-size:2rem;text-align:center;margin-bottom:14px;
  background:linear-gradient(180deg,#fff3b0,#ffb300 45%,#ff4d00);-webkit-background-clip:text;background-clip:text;color:transparent}
.admin-card{max-width:820px;max-height:92vh;overflow:auto}
.btn{font-family:'Cinzel',serif;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;border:1px solid var(--gold-dark);
  background:linear-gradient(180deg,#5a1206,#2a0704);color:#ffe3a0;font-size:.85rem;transition:.15s}
.btn:hover{border-color:var(--gold);color:#fff}
.btn.primary{background:linear-gradient(180deg,#ffb300,#ff5a00 50%,#b3130f);color:#fff;border-color:var(--gold);text-shadow:0 1px 0 #5a0704}
.btn.danger{background:linear-gradient(180deg,#6b0a0a,#2a0303)}
.btn.sm{padding:6px 9px;font-size:.78rem}
input[type=text],input[type=password],input[type=number]{font-family:inherit;background:#0b0202;border:1px solid var(--gold-dark);color:#fff;border-radius:8px;padding:8px 10px;font-size:.85rem;width:100%}

input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 8px rgba(255,150,0,.5)}
input[type=date],input[type=time],input[type=url],textarea{font-family:inherit;background:#0b0202;border:1px solid var(--gold-dark);color:#fff;border-radius:8px;padding:8px 10px;font-size:.85rem;width:100%;color-scheme:dark}
textarea{font-family:Georgia,serif;resize:vertical;min-height:62px}
label{font-size:.7rem;color:var(--gold);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px}
.err{color:#ff6b6b;font-size:.8rem;margin-top:6px;min-height:1em;text-align:center}
.close-x{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--gold);font-size:1.6rem;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section-title{margin:20px 0 10px;color:var(--gold);font-size:.9rem;letter-spacing:2px;border-bottom:1px solid var(--gold-dark);padding-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.admin-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;position:sticky;bottom:-26px;background:#120302;padding:12px 0 4px}
.hint{font-size:.7rem;color:#c9a46a}

/* ===== BOTONERA ===== */
html,body{height:100%}
body{overflow:hidden}
.sb{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;padding:58px 16px 16px}
.sb-head{display:flex;flex-direction:column;align-items:center;flex:none}
.sb .title{font-size:clamp(2rem,5vw,3.2rem)}
.sb-tools{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:8px;flex-wrap:wrap}
.sb-tools .vol{display:flex;align-items:center;gap:8px;font-size:.75rem;color:#e8cf9a;letter-spacing:1px}
.sb-tools input[type=range]{accent-color:#ff7a00;width:140px}
.grid{flex:1;min-height:0;display:grid;justify-content:center;align-content:center;gap:var(--gap,14px);margin-top:12px;overflow:auto;padding:6px}
.sbtn{width:var(--s,130px);display:flex;flex-direction:column;align-items:center;gap:calc(var(--s,130px) * .06);background:none;border:none;cursor:pointer;color:#fff;font-family:'Cinzel',serif;padding:0}
.sbtn .cap{--c:#e3192f;width:calc(var(--s,130px) * .78);aspect-ratio:1;border-radius:50%;position:relative;transition:transform .08s;
  background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.75) 0 9%,transparent 30%),
    radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--c) 70%,#fff) 0,var(--c) 45%,color-mix(in srgb,var(--c) 55%,#000) 75%);
  box-shadow:0 calc(var(--s,130px) * .05) 0 color-mix(in srgb,var(--c) 45%,#000),0 calc(var(--s,130px) * .09) calc(var(--s,130px) * .08) rgba(0,0,0,.6),inset 0 -6px 14px rgba(0,0,0,.35),inset 0 4px 10px rgba(255,255,255,.35)}
.sbtn .cap::after{content:"";position:absolute;inset:-6%;border-radius:50%;z-index:-1;background:linear-gradient(180deg,#5a5a5a,#1e1e1e);box-shadow:0 0 0 2px #0d0d0d}
.sbtn:hover .cap{filter:brightness(1.12)}
.sbtn:active .cap,.sbtn.down .cap{transform:translateY(calc(var(--s,130px) * .045)) scale(.97);box-shadow:0 calc(var(--s,130px) * .01) 0 color-mix(in srgb,var(--c) 45%,#000),0 2px 6px rgba(0,0,0,.6),inset 0 -4px 10px rgba(0,0,0,.4),inset 0 4px 10px rgba(255,255,255,.3)}
.sbtn.playing .cap{animation:sbGlow .6s ease-in-out infinite alternate}
@keyframes sbGlow{to{box-shadow:0 calc(var(--s,130px) * .05) 0 color-mix(in srgb,var(--c) 45%,#000),0 0 calc(var(--s,130px) * .25) var(--c),inset 0 -6px 14px rgba(0,0,0,.35),inset 0 4px 10px rgba(255,255,255,.35)}}
.sbtn .lbl{font-weight:900;font-size:clamp(.6rem,calc(var(--s,130px) * .1),1rem);line-height:1.15;text-align:center;max-width:100%;word-break:break-word;
  text-decoration:underline;text-decoration-color:rgba(245,196,81,.5);text-underline-offset:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sbtn.noaudio{opacity:.45}
.empty{text-align:center;color:#c9a46a;font-family:Georgia,serif;align-self:center}
.lock{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle,#1a0402,#050101)}
.lock.show{display:flex}
/* admin */
.srow{display:grid;grid-template-columns:44px 1fr 1.3fr auto;gap:8px;align-items:center;background:rgba(0,0,0,.35);padding:8px;border-radius:12px;border:1px solid rgba(138,90,18,.45);margin-bottom:8px}
.srow input[type=color]{width:44px;height:38px;padding:2px;border-radius:8px;border:1px solid var(--gold-dark);background:#0b0202;cursor:pointer}
.srow .aud{display:flex;gap:6px;align-items:center;min-width:0}
.srow .aud span{font-size:.72rem;color:#c9a46a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.srow .aud span.ok{color:#8aff9e}
.srow .acts{display:flex;gap:4px}
@media (max-width:640px){ .srow{grid-template-columns:44px 1fr auto}.srow .aud{grid-column:1/-1} }
</style>
</head>
<body>
<canvas id="embers"></canvas>
<a class="back" href="index.html">Menú</a>

<main class="sb">
  <div class="sb-head">
    <h1 class="title" id="titleText">Botonera</h1>
    <div class="sb-tools">
      <label class="vol">🔊 <input type="range" id="vol" min="0" max="100" step="5"></label>
      <button class="btn sm" type="button" id="stopAll">⏹ Parar todo</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>
</main>

<div class="corner"><button id="adminBtn" title="Admin">⚙️</button></div>

<!-- Solo superadmin -->
<div class="lock" id="lock">
  <div class="card" style="text-align:center">
    <h2>🔒 Botonera</h2>
    <p style="font-size:.8rem;color:#e8cf9a;margin:-6px 0 14px;font-family:Georgia,serif">Solo para el superadmin</p>
    <input type="password" id="lockPwd" placeholder="Contraseña de superadmin" autocomplete="current-password">
    <div class="err" id="lockErr"></div>
    <div style="margin-top:10px;display:flex;gap:8px;justify-content:center"><a class="btn" href="index.html" style="text-decoration:none">Volver</a><button class="btn primary" type="button" id="lockBtn">Entrar</button></div>
  </div>
</div>

<!-- Admin -->
<div class="modal" id="adminModal">
  <div class="card admin-card">
    <button class="close-x" data-close="adminModal">×</button>
    <h2>Botones</h2>
    <div class="section-title"><span>SONIDOS</span><button class="btn sm" id="addS">+ Añadir botón</button></div>
    <div id="sList"></div>
    <div class="admin-actions">
      <button class="btn" data-close="adminModal">Cancelar</button>
      <button class="btn primary" id="saveBtn">Guardar</button>
    </div>
    <div class="err" id="adminErr"></div>
  </div>
</div>
<input type="file" id="audFile" accept="audio/*" hidden>

<script src="db.js"></script>
<script src="timer.js"></script>
<script src="auth.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const PAGE = 'sonidos', LKEY = 'karreSonidos_v1', VKEY = 'karreSonidosVol';
const COLORS = ['#e3192f','#111111','#5be39a','#7a3e12','#2ecc40','#f2a7c9','#f5d000','#f0b84a','#3fd6e8','#8b0000','#ff00aa','#1d3fd6','#3a8bff'];
const newId = () => Math.random().toString(36).slice(2, 12).replace(/[^a-z0-9]/g, 'x').padEnd(8, 'x');
let sounds = [], draft = null, audios = {}, playing = new Set();
if(new URLSearchParams(location.search).has('obs')) document.body.classList.add('obs');

/* ---------- Acceso ---------- */
const isSuper = () => KAuth.role() === 'super' || (!KDB.enabled && KAuth.role());
function gate(){ $('#lock').classList.toggle('show', !isSuper()); if(!isSuper()) setTimeout(() => $('#lockPwd').focus(), 50); }
async function unlock(){
  const pwd = $('#lockPwd').value; if(!pwd) return;
  $('#lockErr').textContent = 'Comprobando…';
  try{
    if(!KDB.enabled){ $('#lockErr').textContent = 'La botonera necesita la base de datos.'; return; }
    const r = await KAuth.login(pwd, PAGE, ''); KAuth.refresh();
    if(KAuth.role() !== 'super'){ $('#lockErr').textContent = r.role === 'mod' ? 'Los moderadores no tienen acceso a la botonera' : 'Contraseña incorrecta'; return; }
    $('#lockErr').textContent = ''; gate();
  }catch(e){ $('#lockErr').textContent = 'Error de conexión: ' + e.message; }
}
$('#lockBtn').onclick = unlock;
$('#lockPwd').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); unlock(); } });

/* ---------- Datos ---------- */
async function loadSounds(){
  try{
    if(KDB.enabled) sounds = await KDB.loadSounds();
    else sounds = JSON.parse(localStorage.getItem(LKEY) || '[]');
  }catch(e){ KDB.toast('⚠ ' + e.message, false); sounds = []; }
  sounds.sort((a, b) => (a.pos || 0) - (b.pos || 0));
  audios = {}; render();
}

/* ---------- Pintar y ajustar a la pantalla ---------- */
function render(){
  const g = $('#grid'); g.innerHTML = '';
  if(!sounds.length){ g.innerHTML = '<p class="empty">Aún no hay botones. Pulsa ⚙️ para añadirlos.</p>'; g.style.gridTemplateColumns = ''; return; }
  sounds.forEach(s => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'sbtn' + (s.audio ? '' : ' noaudio'); b.dataset.id = s.id; b.title = s.name || '';
    b.innerHTML = '<span class="cap"></span><span class="lbl"></span>';
    b.querySelector('.cap').style.setProperty('--c', s.color || '#e3192f'); b.querySelector('.lbl').textContent = s.name || 'Sin nombre';
    b.addEventListener('pointerdown', () => { b.classList.add('down'); play(s, b); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, () => b.classList.remove('down')));
    g.append(b);
  });
  fit();
}
// busca el tamaño de botón más grande con el que caben todos sin hacer scroll
function fit(){
  const g = $('#grid'), n = sounds.length; if(!n) return;
  const W = g.clientWidth - 12, H = g.clientHeight - 12, gap = 14;
  let best = { s: 0, cols: 1 };
  for(let cols = 1; cols <= n; cols++){
    const rows = Math.ceil(n / cols);
    const s = Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows / 1.18);
    if(s > best.s) best = { s, cols };
  }
  const s = Math.max(64, Math.min(220, Math.floor(best.s)));
  const cols = Math.max(1, Math.min(n, Math.floor((W + gap) / (s + gap))));
  g.style.setProperty('--s', s + 'px'); g.style.gridTemplateColumns = `repeat(${cols}, ${s}px)`;
}
addEventListener('resize', () => { clearTimeout(fit.t); fit.t = setTimeout(fit, 80); });

/* ---------- Sonar ---------- */
const vol = () => Math.max(0, Math.min(1, (+$('#vol').value || 0) / 100));
function play(s, btn){
  if(!s.audio) return;
  const a = new Audio(s.audio); a.volume = vol();
  playing.add(a); btn.classList.add('playing');
  const end = () => { playing.delete(a); if(![...playing].some(x => x._id === s.id)) btn.classList.remove('playing'); };
  a._id = s.id; a.onended = end; a.onerror = end; a.play().catch(end);
}
$('#stopAll').onclick = () => { playing.forEach(a => { try{ a.pause(); }catch(e){} }); playing.clear(); document.querySelectorAll('.sbtn.playing').forEach(b => b.classList.remove('playing')); };
try{ $('#vol').value = localStorage.getItem(VKEY) ?? 80; }catch(e){ $('#vol').value = 80; }
$('#vol').oninput = () => { try{ localStorage.setItem(VKEY, $('#vol').value); }catch(e){} playing.forEach(a => a.volume = vol()); };

/* ---------- Admin ---------- */
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $('#' + b.dataset.close).classList.remove('show'));
$('#adminBtn').onclick = () => { if(!isSuper()) return gate(); openAdmin(); };
let audTarget = null;
function openAdmin(){
  draft = sounds.map(s => ({ ...s, _audioChanged: false }));
  $('#adminErr').textContent = ''; renderList(); $('#adminModal').classList.add('show');
}
function renderList(){
  const L = $('#sList'); L.innerHTML = '';
  if(!draft.length){ L.innerHTML = '<p class="hint" style="text-align:center;padding:14px">Pulsa «+ Añadir botón».</p>'; return; }
  draft.forEach((s, i) => {
    const row = document.createElement('div'); row.className = 'srow';
    const col = document.createElement('input'); col.type = 'color'; col.value = s.color || '#e3192f'; col.title = 'Color'; col.oninput = () => s.color = col.value;
    const nm = document.createElement('input'); nm.type = 'text'; nm.placeholder = 'Nombre del botón'; nm.value = s.name || ''; nm.oninput = () => s.name = nm.value;
    const aud = document.createElement('div'); aud.className = 'aud';
    const st = document.createElement('span'); st.className = s.audio ? 'ok' : ''; st.textContent = s.audio ? (s.audio.startsWith('data:') ? '✓ Audio subido' : s.audio) : 'Sin audio';
    const up = document.createElement('button'); up.className = 'btn sm'; up.type = 'button'; up.textContent = '🎵 Subir'; up.onclick = () => { audTarget = { s, st }; $('#audFile').click(); };
    const url = document.createElement('button'); url.className = 'btn sm'; url.type = 'button'; url.textContent = '🔗'; url.title = 'Usar una URL de audio';
    url.onclick = () => { const v = (window.prompt ? prompt('URL del audio (mp3, ogg, wav…)', s.audio && !s.audio.startsWith('data:') ? s.audio : '') : null); if(v != null){ s.audio = v.trim(); s._audioChanged = true; st.textContent = s.audio || 'Sin audio'; st.className = s.audio ? 'ok' : ''; } };
    const pl = document.createElement('button'); pl.className = 'btn sm'; pl.type = 'button'; pl.textContent = '▶'; pl.title = 'Probar'; pl.onclick = () => { if(s.audio){ const a = new Audio(s.audio); a.volume = vol(); a.play().catch(() => {}); } };
    aud.append(st, up, url, pl);
    const acts = document.createElement('div'); acts.className = 'acts';
    const mk = (t, title, fn, cls = '') => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn sm ' + cls; b.textContent = t; b.title = title; b.onclick = fn; acts.append(b); };
    mk('▲', 'Subir', () => { if(i > 0){ [draft[i-1], draft[i]] = [draft[i], draft[i-1]]; renderList(); } });
    mk('▼', 'Bajar', () => { if(i < draft.length - 1){ [draft[i+1], draft[i]] = [draft[i], draft[i+1]]; renderList(); } });
    mk('✕', 'Eliminar', () => { draft.splice(i, 1); renderList(); }, 'danger');
    row.append(col, nm, aud, acts); L.append(row);
  });
}
$('#addS').onclick = () => { draft.push({ id: newId(), name: '', color: COLORS[draft.length % COLORS.length], audio: '', pos: draft.length, _audioChanged: true }); renderList(); $('#sList').lastElementChild.querySelector('input[type=text]').focus(); };
$('#audFile').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f || !audTarget) return;
  if(!f.type.startsWith('audio/')){ $('#adminErr').textContent = 'Ese archivo no es un audio.'; return; }
  if(f.size > 2 * 1024 * 1024){ $('#adminErr').textContent = 'El audio pesa más de 2 MB. Recórtalo o usa una URL.'; return; }
  const t = audTarget, rd = new FileReader();
  rd.onload = () => { t.s.audio = rd.result; t.s._audioChanged = true; t.st.textContent = '✓ ' + f.name; t.st.className = 'ok'; if(!(t.s.name || '').trim()){ t.s.name = f.name.replace(/\.[^.]+$/, ''); renderList(); } $('#adminErr').textContent = ''; };
  rd.readAsDataURL(f);
};
$('#saveBtn').onclick = async () => {
  const list = draft.filter(s => (s.name || '').trim() || s.audio).map((s, i) => ({ ...s, name: (s.name || '').trim(), pos: i }));
  const removed = sounds.filter(o => !list.some(s => s.id === o.id));
  const btn = $('#saveBtn'); btn.disabled = true; $('#adminErr').textContent = 'Guardando…';
  try{
    if(KDB.enabled){
      const getPass = () => KAuth.pass();
      for(const s of list){
        const old = sounds.find(o => o.id === s.id);
        const same = old && old.name === s.name && old.color === s.color && old.pos === s.pos && !s._audioChanged;
        if(!same) await KDB.saveSound(getPass, { id: s.id, name: s.name, color: s.color, pos: s.pos, audio: s._audioChanged || !old ? (s.audio || '') : undefined });
      }
      for(const o of removed) await KDB.deleteSound(getPass, o.id);
      KDB.toast('✓ Botonera guardada');
    } else {
      try{ localStorage.setItem(LKEY, JSON.stringify(list.map(({ _audioChanged, ...s }) => s))); }catch(e){ throw new Error('Los audios no caben en este navegador. Usa la base de datos.'); }
    }
    sounds = list.map(({ _audioChanged, ...s }) => s); render();
    $('#adminErr').textContent = ''; $('#adminModal').classList.remove('show');
  }catch(e){ $('#adminErr').textContent = '⚠ ' + e.message; }
  btn.disabled = false;
};

/* ---------- Brasas ---------- */
const ec = $('#embers'), ex = ec.getContext('2d'); let parts = [];
const resize = () => { ec.width = innerWidth; ec.height = innerHeight; }; resize(); addEventListener('resize', resize);
(function loop(){
  ex.clearRect(0, 0, ec.width, ec.height);
  if(parts.length < 140 && Math.random() < .35) parts.push({ x: Math.random()*ec.width, y: ec.height+10, vx: (Math.random()-.5)*.6, vy: -(.6+Math.random()*1.6), life: 260+Math.random()*200, max: 460, size: 1+Math.random()*2.5, h: 15+Math.random()*30 });
  ex.globalCompositeOperation = 'lighter';
  parts = parts.filter(p => {
    p.x += p.vx + Math.sin(p.life*.05)*.3; p.y += p.vy; p.life--;
    const a = Math.max(0, p.life/p.max), g = ex.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size*3);
    g.addColorStop(0, `hsla(${p.h+20},100%,75%,${a})`); g.addColorStop(.4, `hsla(${p.h},100%,50%,${a*.6})`); g.addColorStop(1, 'hsla(0,100%,40%,0)');
    ex.fillStyle = g; ex.beginPath(); ex.arc(p.x, p.y, p.size*3, 0, Math.PI*2); ex.fill();
    return p.life > 0;
  });
  ex.globalCompositeOperation = 'source-over';
  requestAnimationFrame(loop);
})();

gate(); loadSounds();
})();
</script>
</body>
