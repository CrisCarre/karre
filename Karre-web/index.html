<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KARRE · Guarida del Dragón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Metal+Mania&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c451;--gold-dark:#8a5a12}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cinzel',serif;color:#fff;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(ellipse at 50% 30%,rgba(160,25,5,.55) 0%,rgba(40,4,2,.9) 45%,#050101 80%),radial-gradient(circle at 50% 110%,rgba(255,90,0,.35),transparent 50%),#050101;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;background-image:radial-gradient(circle at 50% 0,transparent 55%,#ff9a3c 57%,transparent 62%);background-size:34px 22px}
#embers{position:fixed;inset:0;pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:48px 16px 60px;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
.title{font-family:'Metal Mania',cursive;font-weight:400;text-align:center;line-height:1;font-size:clamp(3rem,10vw,6rem);letter-spacing:4px;
  background:linear-gradient(180deg,#fff6c2 0%,#ffc53d 35%,#ff5a00 70%,#a80f07 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 16px rgba(255,80,0,.8)) drop-shadow(0 4px 0 #2a0402)}
.subtitle{margin-top:6px;color:var(--gold);letter-spacing:8px;text-transform:uppercase;font-size:clamp(.75rem,2.2vw,1.05rem);text-shadow:0 0 10px rgba(255,120,0,.8);text-align:center}

.doors{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:50px;width:100%}
.door{--accent:255,90,0;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:34px 22px 28px;border-radius:22px;
  text-decoration:none;color:#fff;overflow:hidden;isolation:isolate;
  background:linear-gradient(180deg,#2a0704,#120302);border:2px solid var(--gold-dark);
  box-shadow:0 10px 30px rgba(0,0,0,.6),inset 0 0 30px rgba(0,0,0,.8);transition:transform .25s,border-color .25s,box-shadow .25s}
.door::after{content:"";position:absolute;inset:auto 0 0 0;height:0;z-index:-1;transition:height .45s ease;
  background:linear-gradient(0deg,rgba(var(--accent),.55),rgba(var(--accent),.15) 60%,transparent)}
.door:hover,.door:focus-visible{transform:translateY(-8px);border-color:var(--gold);outline:none;
  box-shadow:0 18px 40px rgba(0,0,0,.7),0 0 40px rgba(var(--accent),.55),inset 0 0 30px rgba(0,0,0,.6)}
.door:hover::after,.door:focus-visible::after{height:100%}
.door.mods{--accent:57,220,90}
.door.ruleta{--accent:255,90,0}
.door.rank{--accent:170,90,255}
.door.spirits{--accent:80,200,255}
.medal{width:120px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:3.4rem;
  background:radial-gradient(circle at 40% 35%,rgba(var(--accent),.55),#1a0402 70%);
  box-shadow:0 0 0 4px #1a0402,0 0 0 8px var(--gold),0 0 0 10px #3a1a03,0 0 30px rgba(var(--accent),.6);transition:transform .35s}
.door:hover .medal{transform:scale(1.08) rotate(-6deg)}
.door h2{font-family:'Metal Mania',cursive;font-weight:400;font-size:1.9rem;letter-spacing:2px;
  background:linear-gradient(180deg,#fff3b0,#ffb300 45%,#ff4d00);-webkit-background-clip:text;background-clip:text;color:transparent}
.door p{color:#e8cf9a;font-size:.9rem;line-height:1.4}
.door .go{margin-top:auto;font-size:.8rem;letter-spacing:3px;text-transform:uppercase;padding:8px 22px;border-radius:30px;border:1px solid var(--gold);color:var(--gold);transition:.25s}
.door:hover .go{background:var(--gold);color:#2a0704}

@media (max-width:1000px) and (min-width:821px){.doors{grid-template-columns:repeat(2,1fr);max-width:760px}}
@media (max-width:820px){.doors{grid-template-columns:1fr;max-width:420px}.door{flex-direction:row;text-align:left;padding:18px}.medal{width:78px;font-size:2.2rem;flex:none}.door h2{font-size:1.6rem}.door .go{display:none}.door .txt{display:flex;flex-direction:column;gap:4px}}
</style>
</head>
<body>
<canvas id="embers"></canvas>
<main class="page">
  <h1 class="title">KARRE</h1>
  <p class="subtitle">Gaming &amp; más</p>

  <nav class="doors">
    <a class="door mods" href="moderadores.html">
      <div class="medal">🛡️</div>
      <div class="txt"><h2>Moderadores</h2><p>Conoce al equipo que vigila la guarida</p></div>
      <span class="go">Entrar</span>
    </a>
    <a class="door ruleta" href="ruleta-dragon.html">
      <div class="medal">🎡</div>
      <div class="txt"><h2>Ruleta</h2><p>Retos y premios elegidos por el dragón</p></div>
      <span class="go">Entrar</span>
    </a>
    <a class="door rank" href="ranking.html">
      <div class="medal">🏆</div>
      <div class="txt"><h2>Ranking</h2><p>Los más top de la comunidad</p></div>
      <span class="go">Entrar</span>
    </a>
    <a class="door spirits" href="espiritus.html">
      <div class="medal">👻</div>
      <div class="txt"><h2>Espíritus</h2><p>La lista de lo que reparte el dragón</p></div>
      <span class="go">Entrar</span>
    </a>
  </nav>
</main>
<script>
(() => {
  const ec = document.getElementById('embers'), ex = ec.getContext('2d'); let parts = [];
  const resize = () => { ec.width = innerWidth; ec.height = innerHeight; }; resize(); addEventListener('resize', resize);
  (function loop(){
    ex.clearRect(0,0,ec.width,ec.height);
    if(parts.length < 300 && Math.random() < .6) parts.push({x:Math.random()*ec.width,y:ec.height+10,vx:(Math.random()-.5)*.6,vy:-(.6+Math.random()*1.6),life:260+Math.random()*200,max:460,size:1+Math.random()*2.5,h:15+Math.random()*30});
    ex.globalCompositeOperation = 'lighter';
    parts = parts.filter(p => {
      p.x += p.vx + Math.sin(p.life*.05)*.3; p.y += p.vy; p.life--;
      const a = Math.max(0,p.life/p.max), g = ex.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*3);
      g.addColorStop(0,`hsla(${p.h+20},100%,75%,${a})`); g.addColorStop(.4,`hsla(${p.h},100%,50%,${a*.6})`); g.addColorStop(1,'hsla(0,100%,40%,0)');
      ex.fillStyle = g; ex.beginPath(); ex.arc(p.x,p.y,p.size*3,0,Math.PI*2); ex.fill();
      return p.life > 0;
    });
    ex.globalCompositeOperation = 'source-over';
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
