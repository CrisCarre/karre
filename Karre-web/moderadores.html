<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderadores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Metal+Mania&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c451;--gold-dark:#8a5a12}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cinzel',serif;color:#fff;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(ellipse at 50% 30%,rgba(160,25,5,.55) 0%,rgba(40,4,2,.9) 45%,#050101 80%),radial-gradient(circle at 50% 110%,rgba(255,90,0,.35),transparent 50%),#050101;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;background-image:radial-gradient(circle at 50% 0,transparent 55%,#ff9a3c 57%,transparent 62%);background-size:34px 22px}
#embers{position:fixed;inset:0;pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:60px 16px 90px}
.title{font-family:'Metal Mania',cursive;font-weight:400;text-align:center;line-height:1;font-size:clamp(2.4rem,7vw,4.4rem);letter-spacing:2px;
  background:linear-gradient(180deg,#fff6c2 0%,#ffc53d 35%,#ff5a00 70%,#a80f07 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,80,0,.75)) drop-shadow(0 3px 0 #2a0402)}
.subtitle{margin-top:6px;color:var(--gold);letter-spacing:6px;text-transform:uppercase;font-size:clamp(.75rem,2vw,1rem);text-shadow:0 0 10px rgba(255,120,0,.8);text-align:center}
.back{position:fixed;top:14px;left:14px;z-index:20;font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;letter-spacing:2px;text-decoration:none;color:#ffe3a0;
  padding:9px 18px;border-radius:30px;border:2px solid var(--gold-dark);background:rgba(20,4,2,.85);transition:.2s}
.back:hover{border-color:var(--gold);color:#fff;box-shadow:0 0 12px rgba(255,150,0,.6)}
.corner{position:fixed;right:14px;bottom:14px;z-index:20}
.corner button{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold-dark);background:rgba(20,4,2,.85);font-size:1.2rem;cursor:pointer;transition:.2s}
.corner button:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(255,150,0,.6)}
body.obs .corner,body.obs .back{display:none}

/* ===== TARJETAS ===== */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px;margin-top:40px}
.mod{--c:245,196,81;position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 18px 22px;border-radius:20px;
  background:linear-gradient(180deg,#2a0704,#120302);border:2px solid var(--gold-dark);box-shadow:0 10px 26px rgba(0,0,0,.6),inset 0 0 30px rgba(0,0,0,.8);
  transition:transform .25s,box-shadow .25s,border-color .25s;animation:rise .5s both}
.mod:hover{transform:translateY(-6px);border-color:rgb(var(--c));box-shadow:0 16px 34px rgba(0,0,0,.7),0 0 30px rgba(var(--c),.45)}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
.mod.r-admin{--c:255,80,20}.mod.r-mod{--c:57,220,90}.mod.r-vip{--c:170,90,255}
.av{width:110px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:'Metal Mania',cursive;font-size:3rem;color:#fff;
  background:radial-gradient(circle at 40% 35%,rgba(var(--c),.7),#1a0402 75%) center/cover no-repeat;
  box-shadow:0 0 0 4px #1a0402,0 0 0 7px rgb(var(--c)),0 0 26px rgba(var(--c),.55)}
.mod h3{font-weight:900;font-size:1.25rem;margin-top:8px;word-break:break-word}
.badge{font-size:.7rem;letter-spacing:3px;text-transform:uppercase;padding:4px 14px;border-radius:20px;color:#fff;
  background:rgba(var(--c),.25);border:1px solid rgb(var(--c));text-shadow:0 0 8px rgba(var(--c),.9)}
.mod p{color:#e8cf9a;font-size:.85rem;line-height:1.45;font-family:Georgia,serif}
.socials{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.socials a{font-size:.72rem;letter-spacing:1px;text-decoration:none;color:#ffe3a0;padding:5px 12px;border-radius:20px;border:1px solid var(--gold-dark);background:rgba(0,0,0,.4);transition:.2s}
.socials a:hover{border-color:var(--gold);color:#fff;background:rgba(255,150,0,.2)}
.empty{text-align:center;color:#c9a46a;margin-top:50px}

/* ===== MODALES / ADMIN ===== */
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
.modal.show{display:flex}
.card{position:relative;background:linear-gradient(180deg,#2a0704,#120302);border:2px solid var(--gold);border-radius:18px;padding:26px;
  box-shadow:0 0 40px rgba(255,80,0,.5),inset 0 0 30px rgba(0,0,0,.8);width:100%;max-width:440px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.card h2{font-family:'Metal Mania',cursive;font-weight:400;font-size:2rem;text-align:center;margin-bottom:14px;
  background:linear-gradient(180deg,#fff3b0,#ffb300 45%,#ff4d00);-webkit-background-clip:text;background-clip:text;color:transparent}
.admin-card{max-width:820px;max-height:92vh;overflow:auto}
.btn{font-family:'Cinzel',serif;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;border:1px solid var(--gold-dark);
  background:linear-gradient(180deg,#5a1206,#2a0704);color:#ffe3a0;font-size:.85rem;transition:.15s}
.btn:hover{border-color:var(--gold);color:#fff}
.btn.primary{background:linear-gradient(180deg,#ffb300,#ff5a00 50%,#b3130f);color:#fff;border-color:var(--gold);text-shadow:0 1px 0 #5a0704}
.btn.danger{background:linear-gradient(180deg,#6b0a0a,#2a0303)}
.btn.sm{padding:6px 10px;font-size:.8rem}
input[type=text],input[type=password]{font-family:inherit;background:#0b0202;border:1px solid var(--gold-dark);color:#fff;border-radius:8px;padding:8px 10px;font-size:.85rem;width:100%}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 8px rgba(255,150,0,.5)}
label{font-size:.7rem;color:var(--gold);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:3px}
.err{color:#ff6b6b;font-size:.8rem;margin-top:6px;min-height:1em;text-align:center}
.close-x{position:absolute;top:10px;right:14px;background:none;border:none;color:var(--gold);font-size:1.6rem;cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.section-title{margin:20px 0 10px;color:var(--gold);font-size:.9rem;letter-spacing:2px;border-bottom:1px solid var(--gold-dark);padding-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.list{display:flex;flex-direction:column;gap:10px}
.mrow{display:grid;grid-template-columns:84px 1fr auto;gap:12px;align-items:start;background:rgba(0,0,0,.35);padding:10px;border-radius:12px;border:1px solid rgba(138,90,18,.45)}
.av-edit{display:flex;flex-direction:column;align-items:center;gap:6px}
.av-edit .av{width:72px;font-size:1.8rem;cursor:pointer;box-shadow:0 0 0 2px #1a0402,0 0 0 4px var(--gold)}
.av-edit .av:hover{filter:brightness(1.2)}
.fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.fields .wide{grid-column:span 2}.fields .full{grid-column:1/-1}
.acts{display:flex;flex-direction:column;gap:4px}
.admin-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;position:sticky;bottom:-26px;background:#120302;padding:12px 0 4px}
.hint{font-size:.7rem;color:#c9a46a;margin-top:6px}
@media (max-width:640px){
  .grid2{grid-template-columns:1fr}
  .mrow{grid-template-columns:1fr}
  .fields{grid-template-columns:1fr 1fr}
  .fields .wide{grid-column:1/-1}
  .acts{flex-direction:row;justify-content:flex-end}
}
</style>
</head>
<body>
<canvas id="embers"></canvas>
<a class="back" href="index.html">Menú</a>

<main class="page">
  <h1 class="title" id="titleText">Moderadores</h1>
  <p class="subtitle" id="subtitleText">El equipo del dragón</p>
  <section class="mods" id="mods"></section>
</main>

<div class="corner"><button id="adminBtn" title="Admin">⚙️</button></div>

<!-- Login -->
<div class="modal" id="loginModal">
  <div class="card">
    <button type="button" class="close-x" data-close="loginModal">×</button>
    <h2>Admin Moderadores</h2>
    <label for="pwd">Contraseña</label>
    <input type="password" id="pwd" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <div style="text-align:center;margin-top:10px"><button class="btn primary" type="button" id="loginBtn">Entrar</button></div>
  </div>
</div>

<!-- Admin -->
<div class="modal" id="adminModal">
  <div class="card admin-card">
    <button class="close-x" data-close="adminModal">×</button>
    <h2>Panel de Moderadores</h2>
    <div class="grid2">
      <div><label>Título</label><input type="text" id="aTitle"></div>
      <div><label>Subtítulo</label><input type="text" id="aSubtitle"></div>
      <div><label>Nueva contraseña (opcional)</label><input type="text" id="aPassword" placeholder="Dejar vacío para no cambiar"></div>
    </div>
    <div class="section-title"><span>EQUIPO</span><button class="btn sm" id="addMod">+ Añadir</button></div>
    <div class="hint" style="margin:-4px 0 10px">Pulsa la foto para subir una imagen (PNG, JPG o GIF). En las redes pon solo el usuario o el enlace completo.</div>
    <div class="list" id="modList"></div>
    <div class="admin-actions">
      <button class="btn" data-close="adminModal">Cancelar</button>
      <button class="btn primary" id="saveBtn">Guardar</button>
    </div>
    <div class="err" id="adminErr"></div>
  </div>
</div>
<input type="file" id="avFile" accept="image/*" hidden>
<datalist id="roles"><option value="Admin"><option value="Moderador"><option value="VIP"><option value="Colaborador"></datalist>

<script src="db.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'karreModeradores_v1';
const DEFAULTS = {
  title: 'Moderadores',
  subtitle: 'El equipo del dragón',
  password: 'dragon',
  mods: [
    { name: 'Karre',       role: 'Admin',     avatar: '', desc: 'Creador del canal y dueño de la guarida.', tiktok: '', youtube: 'Karre_youtube', twitch: '' },
    { name: 'Moderador 1', role: 'Moderador', avatar: '', desc: 'Vigila el chat y ayuda a la comunidad.', tiktok: '', youtube: '', twitch: '' },
    { name: 'Moderador 2', role: 'Moderador', avatar: '', desc: 'Organiza partidas y eventos.', tiktok: '', youtube: '', twitch: '' },
    { name: 'VIP 1',       role: 'VIP',       avatar: '', desc: 'Miembro veterano de la comunidad.', tiktok: '', youtube: '', twitch: '' }
  ]
};
const clone = o => JSON.parse(JSON.stringify(o));
function fromData(d){ return d && Array.isArray(d.mods) ? { ...clone(DEFAULTS), ...d } : clone(DEFAULTS); }
function load(){ try{ return fromData(JSON.parse(localStorage.getItem(KEY))); }catch(e){ return clone(DEFAULTS); } }
/* ---------- Base de datos (Supabase, ver db.js) ---------- */
const PAGE = 'moderadores';
const PRIVATE = ['password'];                 // nunca se suben a la BBDD
let sessionPwd = '', remoteEmpty = false;
let onSaved = ok => { if(ok) KDB.toast('✓ Guardado en la base de datos'); };
const publicData = () => { const o = clone(state); PRIVATE.forEach(k => delete o[k]); return o; };
function saveLocal(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }catch(e){ return false; } }
function save(){
  const okLocal = saveLocal();
  if(KDB.enabled && sessionPwd){
    KDB.save(PAGE, publicData(), () => sessionPwd).then(() => onSaved(true)).catch(err => { onSaved(false); KDB.toast('⚠ No se guardó: ' + err.message, false); });
    return true;
  }
  return okLocal;
}
let state = load(), draft = null, unlocked = false;
if(new URLSearchParams(location.search).has('obs')) document.body.classList.add('obs');

const cssUrl = u => `url("${String(u).replace(/"/g,'%22')}")`;
const roleClass = r => { r = (r||'').toLowerCase(); return r.includes('admin') ? 'r-admin' : r.includes('mod') ? 'r-mod' : r.includes('vip') ? 'r-vip' : ''; };
function socialUrl(kind, v){
  v = (v||'').trim(); if(!v) return '';
  if(/^https?:\/\//i.test(v)) return v;
  v = v.replace(/^@/,'');
  return kind === 'tiktok' ? `https://www.tiktok.com/@${encodeURIComponent(v)}` : kind === 'youtube' ? `https://www.youtube.com/@${encodeURIComponent(v)}` : `https://www.twitch.tv/${encodeURIComponent(v)}`;
}
function setAvatar(el, m){
  el.style.backgroundImage = m.avatar ? cssUrl(m.avatar) : '';
  el.textContent = m.avatar ? '' : ((m.name||'?').trim()[0] || '?').toUpperCase();
}

/* ---------- Vista pública ---------- */
function render(){
  $('#titleText').textContent = state.title; $('#subtitleText').textContent = state.subtitle; document.title = state.title;
  const box = $('#mods'); box.innerHTML = '';
  if(!state.mods.length){ box.innerHTML = '<p class="empty">Todavía no hay moderadores.</p>'; return; }
  state.mods.forEach((m,i) => {
    const c = document.createElement('article'); c.className = 'mod ' + roleClass(m.role); c.style.animationDelay = (i*.07)+'s';
    const av = document.createElement('div'); av.className = 'av'; setAvatar(av, m);
    const h = document.createElement('h3'); h.textContent = m.name;
    c.append(av, h);
    if(m.role){ const b = document.createElement('span'); b.className = 'badge'; b.textContent = m.role; c.append(b); }
    if(m.desc){ const p = document.createElement('p'); p.textContent = m.desc; c.append(p); }
    const soc = document.createElement('div'); soc.className = 'socials';
    [['tiktok','TikTok'],['youtube','YouTube'],['twitch','Twitch']].forEach(([k,label]) => {
      const u = socialUrl(k, m[k]); if(!u) return;
      const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener'; a.textContent = label; soc.append(a);
    });
    if(soc.children.length) c.append(soc);
    box.append(c);
  });
}

/* ---------- Imágenes ---------- */
function readImage(file, max = 256){
  return new Promise((res, rej) => {
    if(!file.type.startsWith('image/')) return rej('Ese archivo no es una imagen.');
    if(file.type === 'image/gif'){
      if(file.size > 1.5*1024*1024) return rej('El GIF pesa más de 1,5 MB.');
      const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(file); return;
    }
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max/Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src); res(c.toDataURL('image/webp', .85));
    };
    img.onerror = () => rej('No se pudo leer la imagen.');
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- Login ---------- */
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $('#'+b.dataset.close).classList.remove('show'));
$('#adminBtn').onclick = () => {
  if(unlocked) return openAdmin();
  $('#pwd').value = ''; $('#loginErr').textContent = ''; $('#loginModal').classList.add('show'); setTimeout(() => $('#pwd').focus(), 50);
};
async function tryLogin(){
  const pwd = $('#pwd').value; let ok;
  if(KDB.enabled){
    $('#loginErr').textContent = 'Comprobando…';
    try{ ok = await KDB.login(PAGE, pwd); }catch(e){ $('#loginErr').textContent = 'Error de conexión: ' + e.message; return; }
  } else ok = pwd === state.password;
  if(ok){
    sessionPwd = pwd; unlocked = true; $('#loginErr').textContent = ''; $('#loginModal').classList.remove('show');
    if(remoteEmpty){ remoteEmpty = false; save(); }   // primera vez: sube lo que había en este navegador
    openAdmin();
  }
  else $('#loginErr').textContent = 'Contraseña incorrecta';
}
$('#loginBtn').onclick = tryLogin;
$('#pwd').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); tryLogin(); } });

/* ---------- Admin ---------- */
let avTarget = -1;
function openAdmin(){
  draft = clone(state);
  $('#aTitle').value = draft.title; $('#aSubtitle').value = draft.subtitle; $('#aPassword').value = ''; $('#adminErr').textContent = '';
  renderList(); $('#adminModal').classList.add('show');
}
function renderList(){
  const list = $('#modList'); list.innerHTML = '';
  draft.mods.forEach((m,i) => {
    const row = document.createElement('div'); row.className = 'mrow';
    row.innerHTML = `
      <div class="av-edit"><div class="av" title="Cambiar foto"></div><button class="btn sm danger" data-a="noav">Quitar foto</button></div>
      <div class="fields">
        <div><label>Nombre</label><input type="text" data-f="name"></div>
        <div><label>Rango</label><input type="text" data-f="role" list="roles"></div>
        <div><label>Foto (URL)</label><input type="text" data-f="avatar" placeholder="o pulsa la foto"></div>
        <div class="full"><label>Descripción</label><input type="text" data-f="desc"></div>
        <div><label>TikTok</label><input type="text" data-f="tiktok" placeholder="usuario"></div>
        <div><label>YouTube</label><input type="text" data-f="youtube" placeholder="usuario"></div>
        <div><label>Twitch</label><input type="text" data-f="twitch" placeholder="usuario"></div>
      </div>
      <div class="acts">
        <button class="btn sm" data-a="up" title="Subir">▲</button>
        <button class="btn sm" data-a="down" title="Bajar">▼</button>
        <button class="btn sm danger" data-a="del" title="Eliminar">✕</button>
      </div>`;
    const av = row.querySelector('.av'); setAvatar(av, m);
    row.querySelectorAll('[data-f]').forEach(inp => {
      const f = inp.dataset.f;
      inp.value = f === 'avatar' && (m.avatar||'').startsWith('data:') ? '' : (m[f] || '');
      inp.oninput = () => { m[f] = inp.value; if(f === 'name' || f === 'avatar') setAvatar(av, m); };
    });
    av.onclick = () => { avTarget = i; $('#avFile').click(); };
    row.querySelector('[data-a=noav]').onclick = () => { m.avatar = ''; renderList(); };
    row.querySelector('[data-a=up]').onclick = () => { if(i > 0){ [draft.mods[i-1], draft.mods[i]] = [draft.mods[i], draft.mods[i-1]]; renderList(); } };
    row.querySelector('[data-a=down]').onclick = () => { if(i < draft.mods.length-1){ [draft.mods[i+1], draft.mods[i]] = [draft.mods[i], draft.mods[i+1]]; renderList(); } };
    row.querySelector('[data-a=del]').onclick = () => { draft.mods.splice(i,1); renderList(); };
    list.append(row);
  });
}
$('#avFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f || avTarget < 0) return;
  try{ draft.mods[avTarget].avatar = await readImage(f); $('#adminErr').textContent = ''; renderList(); }
  catch(err){ $('#adminErr').textContent = err; }
};
$('#addMod').onclick = () => {
  draft.mods.push({ name: 'Nuevo moderador', role: 'Moderador', avatar: '', desc: '', tiktok: '', youtube: '', twitch: '' });
  renderList(); const last = $('#modList').lastElementChild; last.scrollIntoView({ block: 'nearest' }); last.querySelector('[data-f=name]').select();
};
$('#saveBtn').onclick = () => {
  draft.mods = draft.mods.filter(m => (m.name||'').trim());
  draft.title = $('#aTitle').value.trim() || DEFAULTS.title;
  draft.subtitle = $('#aSubtitle').value.trim();
  const np = $('#aPassword').value.trim();
  if(np){
    if(KDB.enabled) KDB.changePassword(PAGE, () => sessionPwd, np, () => { sessionPwd = np; KDB.toast('✓ Contraseña cambiada'); }).catch(e => KDB.toast('⚠ ' + e.message, false));
    else draft.password = np;
  }
  const prev = state; state = draft;
  if(!save()){ state = prev; $('#adminErr').textContent = 'No se pudo guardar: las fotos ocupan demasiado. Usa URLs o imágenes más ligeras.'; return; }
  render(); $('#adminModal').classList.remove('show');
};

/* ---------- Brasas ---------- */
const ec = $('#embers'), ex = ec.getContext('2d'); let parts = [];
const resize = () => { ec.width = innerWidth; ec.height = innerHeight; }; resize(); addEventListener('resize', resize);
(function loop(){
  ex.clearRect(0,0,ec.width,ec.height);
  if(parts.length < 250 && Math.random() < .5) parts.push({x:Math.random()*ec.width,y:ec.height+10,vx:(Math.random()-.5)*.6,vy:-(.6+Math.random()*1.6),life:260+Math.random()*200,max:460,size:1+Math.random()*2.5,h:15+Math.random()*30});
  ex.globalCompositeOperation = 'lighter';
  parts = parts.filter(p => {
    p.x += p.vx + Math.sin(p.life*.05)*.3; p.y += p.vy; p.life--;
    const a = Math.max(0,p.life/p.max), g = ex.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*3);
    g.addColorStop(0,`hsla(${p.h+20},100%,75%,${a})`); g.addColorStop(.4,`hsla(${p.h},100%,50%,${a*.6})`); g.addColorStop(1,'hsla(0,100%,40%,0)');
    ex.fillStyle = g; ex.beginPath(); ex.arc(p.x,p.y,p.size*3,0,Math.PI*2); ex.fill();
    return p.life > 0;
  });
  ex.globalCompositeOperation = 'source-over';
  requestAnimationFrame(loop);
})();

render();

/* ---------- Cargar de la BBDD y escuchar cambios de otros dispositivos ---------- */
if(KDB.enabled){
  const apply = d => { const keep = { password: state.password }; state = { ...fromData(d), ...keep }; saveLocal(); render(); };
  KDB.load(PAGE).then(row => {
    if(row && row.data && Object.keys(row.data).length) apply(row.data);
    else remoteEmpty = true;
  }).catch(e => KDB.toast('⚠ ' + e.message, false));
  KDB.watch(PAGE, apply, () => !!document.querySelector('.modal.show'));
}
})();
</script>
</body>
</html>
