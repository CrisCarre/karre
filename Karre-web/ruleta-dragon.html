<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta del Dragón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Metal+Mania&display=swap" rel="stylesheet">
<style>
:root{
  --fire1:#ff4d00; --fire2:#ffb300; --gold:#f5c451; --gold-dark:#8a5a12;
  --blood:#8b0f0a; --dark:#0d0303; --eye:#39ff5a;
  --size:min(88vw, 64vh, 560px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Cinzel',serif; color:#fff; overflow-x:hidden;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(160,25,5,.55) 0%, rgba(40,4,2,.9) 45%, #050101 80%),
    radial-gradient(circle at 50% 110%, rgba(255,90,0,.35), transparent 50%),
    #050101;
  min-height:100vh;
}
/* patrón de escamas de fondo */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;
  background-image:radial-gradient(circle at 50% 0, transparent 55%, #ff9a3c 57%, transparent 62%);
  background-size:34px 22px;
}
#embers{position:fixed;inset:0;pointer-events:none;z-index:1}

.stage{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 16px 30px;gap:14px}

.title{
  font-family:'Metal Mania',cursive;font-weight:400;text-align:center;line-height:1;
  font-size:clamp(2.2rem,6.5vw,4.4rem);letter-spacing:2px;
  background:linear-gradient(180deg,#fff6c2 0%,#ffc53d 35%,#ff5a00 70%,#a80f07 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,80,0,.75)) drop-shadow(0 3px 0 #2a0402);
}
.title,.subtitle{position:relative;z-index:3}
.subtitle{margin-top:-6px;color:var(--gold);letter-spacing:6px;text-transform:uppercase;font-size:clamp(.75rem,2vw,1rem);text-shadow:0 0 10px rgba(255,120,0,.8)}

/* ===== RUEDA ===== */
.wheel-wrap{position:relative;width:var(--size);aspect-ratio:1;margin-top:10px}

.ring{
  position:absolute;inset:0;border-radius:50%;z-index:1;
  background:conic-gradient(from 0deg,#ffe28a,#b8741a,#5a2a05,#f5c451,#7a3d08,#ffe28a,#9c5a10,#4a2003,#f5c451,#ffe28a);
  box-shadow:0 0 40px rgba(255,90,0,.65),0 0 120px rgba(255,40,0,.35),inset 0 0 18px rgba(0,0,0,.9);
}
.ring::before{
  content:"";position:absolute;inset:3%;border-radius:50%;
  background:radial-gradient(circle,#2a0704 70%,#120302 100%);
  box-shadow:inset 0 0 22px #000,0 0 0 2px rgba(0,0,0,.6);
}
.bulb{
  position:absolute;width:2.6%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 35%,#fff7d0,#ffb300 45%,#ff4d00 100%);
  box-shadow:0 0 6px #ffb300,0 0 14px #ff5a00;
  animation:bulb 1.1s infinite;
}
.bulb:nth-child(even){animation-delay:.55s}
@keyframes bulb{0%,49%{opacity:1;filter:brightness(1.2)}50%,100%{opacity:.35;filter:brightness(.6)}}
.spinning .bulb{animation-duration:.22s}
.win .bulb{animation:bulbWin .18s infinite alternate}
@keyframes bulbWin{from{opacity:.3}to{opacity:1;box-shadow:0 0 10px #fff3a0,0 0 24px #ff5a00}}

#fireBack{position:absolute;left:-40%;top:-55%;width:180%;height:170%;z-index:0;pointer-events:none}
#wheel{position:absolute;inset:8%;width:84%;height:84%;border-radius:50%;z-index:2;will-change:transform;
  box-shadow:0 0 0 3px #1a0402,0 0 0 6px var(--gold-dark)}

.pointer{position:absolute;left:50%;top:-4.5%;width:13%;z-index:5;transform:translateX(-50%);transform-origin:50% 12%;
  filter:drop-shadow(0 4px 6px rgba(0,0,0,.8)) drop-shadow(0 0 8px rgba(255,120,0,.6))}
.pointer.tick{animation:tick .12s ease-out}
@keyframes tick{0%{transform:translateX(-50%) rotate(0)}40%{transform:translateX(-50%) rotate(-14deg)}100%{transform:translateX(-50%) rotate(0)}}

.hub{position:absolute;left:50%;top:50%;width:22%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:4;
  border-radius:50%;border:none;cursor:pointer;padding:0;background:none;
  box-shadow:0 0 0 4px #1a0402,0 0 0 8px var(--gold),0 0 0 10px #3a1a03,0 0 25px 8px rgba(57,255,90,.35);
  animation:eyeGlow 2.5s ease-in-out infinite;transition:transform .2s}
.hub:hover{transform:translate(-50%,-50%) scale(1.05)}
@keyframes eyeGlow{0%,100%{box-shadow:0 0 0 4px #1a0402,0 0 0 8px var(--gold),0 0 0 10px #3a1a03,0 0 20px 6px rgba(57,255,90,.3)}
  50%{box-shadow:0 0 0 4px #1a0402,0 0 0 8px var(--gold),0 0 0 10px #3a1a03,0 0 36px 14px rgba(57,255,90,.55)}}

.hub::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 14px 4px rgba(0,0,0,.85);pointer-events:none}
@keyframes eyeBreath{50%{transform:scale(1.06)}}
.spinning .hub .eye-img{filter:brightness(1.35) saturate(1.4) hue-rotate(-8deg)}
.win .hub .eye-img{filter:brightness(1.6) saturate(1.6);transform:scale(1.12)}
.hub{overflow:hidden}

/* ===== BOTÓN ===== */
.spin-btn{
  font-family:'Metal Mania',cursive;font-size:clamp(1.6rem,4.5vw,2.4rem);letter-spacing:3px;color:#fff;
  padding:12px 54px;border-radius:60px;cursor:pointer;margin-top:8px;position:relative;
  border:3px solid var(--gold);
  background:linear-gradient(180deg,#ffb300 0%,#ff5a00 45%,#b3130f 100%);
  text-shadow:0 2px 0 #5a0704,0 0 12px rgba(255,220,120,.8);
  box-shadow:0 6px 0 #5a0704,0 0 30px rgba(255,90,0,.7),inset 0 2px 6px rgba(255,255,255,.5);
  transition:transform .12s,filter .2s;
}
.spin-btn:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-2px)}
.spin-btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #5a0704,0 0 30px rgba(255,90,0,.7)}
.spin-btn:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}

.history{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:640px;min-height:30px}
.chip{font-size:.72rem;padding:5px 12px;border-radius:20px;background:rgba(0,0,0,.55);border:1px solid var(--gold-dark);color:#ffd98a;animation:chipIn .4s}
.chip:first-child{border-color:var(--gold);box-shadow:0 0 10px rgba(255,150,0,.5);color:#fff}
@keyframes chipIn{from{opacity:0;transform:scale(.6)}}

.corner{position:fixed;right:14px;bottom:14px;z-index:20;display:flex;gap:8px}
.corner button{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold-dark);background:rgba(20,4,2,.85);font-size:1.2rem;cursor:pointer;transition:.2s}
.corner button:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(255,150,0,.6)}
body.obs .corner,body.obs .back{display:none}
.back{position:fixed;top:14px;left:14px;z-index:20;font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;letter-spacing:2px;text-decoration:none;color:#ffe3a0;
  padding:9px 18px;border-radius:30px;border:2px solid var(--gold-dark);background:rgba(20,4,2,.85);transition:.2s}
.back:hover{border-color:var(--gold);color:#fff;box-shadow:0 0 12px rgba(255,150,0,.6)}

/* ===== MODALES ===== */
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
.modal.show{display:flex}
.card{position:relative;background:linear-gradient(180deg,#2a0704,#120302);border:2px solid var(--gold);border-radius:18px;padding:26px;
  box-shadow:0 0 40px rgba(255,80,0,.5),inset 0 0 30px rgba(0,0,0,.8);width:100%;max-width:440px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.card h2{font-family:'Metal Mania',cursive;font-weight:400;font-size:2rem;text-align:center;margin-bottom:14px;
  background:linear-gradient(180deg,#fff3b0,#ffb300 45%,#ff4d00);-webkit-background-clip:text;background-clip:text;color:transparent}

.result-card{text-align:center;max-width:480px}
.result-card .roar{letter-spacing:4px;color:var(--gold);font-size:.8rem;text-transform:uppercase}
.result-emoji{font-size:5rem;margin:8px 0;filter:drop-shadow(0 0 20px rgba(255,120,0,.9));animation:float 1.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) scale(1.05)}}
.result-text{font-weight:900;font-size:clamp(1.4rem,5vw,2rem);text-transform:uppercase;line-height:1.2;margin-bottom:20px;
  text-shadow:0 0 18px rgba(255,90,0,.9),0 3px 0 #5a0704}

.btn{font-family:'Cinzel',serif;font-weight:700;padding:10px 18px;border-radius:10px;cursor:pointer;border:1px solid var(--gold-dark);
  background:linear-gradient(180deg,#5a1206,#2a0704);color:#ffe3a0;font-size:.85rem;transition:.15s}
.btn:hover{border-color:var(--gold);color:#fff}
.btn.primary{background:linear-gradient(180deg,#ffb300,#ff5a00 50%,#b3130f);color:#fff;border-color:var(--gold);text-shadow:0 1px 0 #5a0704}
.btn.danger{background:linear-gradient(180deg,#6b0a0a,#2a0303)}
.btn.sm{padding:6px 10px;font-size:.8rem}

input[type=text],input[type=password],input[type=number]{font-family:inherit;background:#0b0202;border:1px solid var(--gold-dark);color:#fff;border-radius:8px;padding:9px 10px;font-size:.9rem;width:100%}
input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 8px rgba(255,150,0,.5)}
input[type=color]{width:38px;height:38px;border:1px solid var(--gold-dark);border-radius:8px;background:#0b0202;padding:2px;cursor:pointer}
label{font-size:.75rem;color:var(--gold);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:4px}
.err{color:#ff6b6b;font-size:.8rem;margin-top:6px;min-height:1em;text-align:center}

.admin-card{max-width:760px;max-height:92vh;overflow:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.check{display:flex;align-items:center;gap:8px;font-size:.85rem;color:#ffe3a0;text-transform:none;letter-spacing:0}

.items{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:38px 54px 1fr 64px auto;gap:6px;align-items:center;background:rgba(0,0,0,.35);padding:6px;border-radius:10px;border:1px solid rgba(138,90,18,.4)}

/* ===== CONTROLES / RULETA LEGENDARIA ===== */
.controls{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:8px}
.controls .spin-btn{margin-top:0}
.swap-btn{font-family:'Metal Mania',cursive;font-size:clamp(1.05rem,3vw,1.45rem);letter-spacing:2px;color:#fff;padding:12px 26px;border-radius:60px;cursor:pointer;
  border:3px solid #d9c2ff;background:linear-gradient(180deg,#c9a8ff,#7b2cff 50%,#2a0a78);
  text-shadow:0 2px 0 #1a0548,0 0 10px rgba(220,200,255,.8);box-shadow:0 6px 0 #1a0548,0 0 26px rgba(140,60,255,.7),inset 0 2px 6px rgba(255,255,255,.5);transition:transform .12s,filter .2s}
.swap-btn:hover:not(:disabled){filter:brightness(1.15);transform:translateY(-2px)}
.swap-btn:active:not(:disabled){transform:translateY(4px)}
.swap-btn:disabled{filter:grayscale(.6) brightness(.7);cursor:not-allowed}
body:not(.legend) .swap-btn{border-color:var(--gold);background:linear-gradient(180deg,#ffb300,#ff5a00 45%,#b3130f);text-shadow:0 2px 0 #5a0704;box-shadow:0 6px 0 #5a0704,0 0 26px rgba(255,90,0,.7),inset 0 2px 6px rgba(255,255,255,.5)}

body.legend{background:radial-gradient(ellipse at 50% 40%,rgba(90,30,190,.6) 0%,rgba(18,5,48,.93) 45%,#04010c 80%),radial-gradient(circle at 50% 110%,rgba(140,60,255,.4),transparent 50%),#04010c}
body.legend::before{background-image:radial-gradient(circle at 50% 0,transparent 55%,#b388ff 57%,transparent 62%)}
body.legend .title{background:linear-gradient(180deg,#ffffff 0%,#e3d4ff 30%,#9b4dff 65%,#2a0a78 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 0 18px rgba(150,70,255,.9)) drop-shadow(0 3px 0 #12032e)}
body.legend .subtitle{color:#e3d4ff;text-shadow:0 0 12px rgba(150,70,255,.95)}
body.legend .ring{background:conic-gradient(from 0deg,#fff6d0,#c9a8ff,#4b1a9e,#ffd86b,#2a0a78,#fff6d0,#9b6bff,#1a0548,#ffd86b,#fff6d0);animation:legendGlow 2.4s ease-in-out infinite}
@keyframes legendGlow{0%,100%{box-shadow:0 0 45px rgba(150,70,255,.8),0 0 130px rgba(90,40,255,.45),inset 0 0 18px rgba(0,0,0,.9)}
  50%{box-shadow:0 0 70px rgba(190,120,255,1),0 0 190px rgba(110,50,255,.7),inset 0 0 18px rgba(0,0,0,.9)}}

body.legend .bulb{background:radial-gradient(circle at 35% 35%,#ffffff,#c9a8ff 45%,#6a00ff 100%);box-shadow:0 0 6px #c9a8ff,0 0 16px #7b2cff}
body.legend .spin-btn{background:linear-gradient(180deg,#fff0b0,#f5b700 45%,#a86200);border-color:#fff3c4;text-shadow:0 2px 0 #5a3a00,0 0 12px rgba(255,240,180,.9);box-shadow:0 6px 0 #5a3a00,0 0 34px rgba(255,200,60,.85),inset 0 2px 6px rgba(255,255,255,.6)}
body.legend #wheel{box-shadow:0 0 0 3px #12032e,0 0 0 6px #b99bff}

/* admin: pestañas e imagen */
.tabs{display:flex;gap:6px;margin:16px 0 12px}
.tab{flex:1}
.tab.active{background:linear-gradient(180deg,#ffb300,#ff5a00 50%,#b3130f);color:#fff;border-color:var(--gold)}
.tab[data-tab=legend].active{background:linear-gradient(180deg,#c9a8ff,#7b2cff 50%,#2a0a78);border-color:#d9c2ff}

  .grid2{grid-template-columns:1fr}
  .row{grid-template-columns:38px 48px 1fr 56px}
  .row .acts{grid-column:1/-1;justify-content:flex-end}

<script src="db.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const STORE_KEY = 'ruletaDragon_v1';

const NORMAL_ITEMS = [
  { text: 'Te regalo una skin',        emoji: '🎁', color: '#c92a2a', weight: 1 },
  { text: 'Te regalo un gesto',        emoji: '💃', color: '#f08c00', weight: 1 },
  { text: 'Elige mi próxima skin',     emoji: '👕', color: '#2f9e44', weight: 1 },
  { text: 'Prohibido los coches',      emoji: '🚫', color: '#7a0f0f', weight: 1 },
  { text: 'Partida solo a subfusiles', emoji: '🔫', color: '#d9480f', weight: 1 },
  { text: 'Juegas con construcción',   emoji: '🧱', color: '#8c5a12', weight: 1 },
  { text: 'Elige un reto para mí',     emoji: '🎮', color: '#1b6b34', weight: 1 },
  { text: 'Tira de nuevo',             emoji: '🔥', color: '#e67700', weight: 1 }
];
const LEGEND_ITEMS = [
  { text: '1000 pavos',                 emoji: '💰', color: '#b8860b', weight: 1 },
  { text: 'Te regalo el pase de batalla', emoji: '🎟️', color: '#5b21b6', weight: 1 },
  { text: 'Skin legendaria a elegir',   emoji: '👑', color: '#9f1239', weight: 1 },
  { text: 'Lote de 3 gestos',           emoji: '🕺', color: '#1e40af', weight: 1 },
  { text: 'Te regalo un lote de la tienda', emoji: '🛒', color: '#7e22ce', weight: 1 },
  { text: 'Partida conmigo en directo', emoji: '🎮', color: '#0e7490', weight: 1 },
  { text: 'Doble premio',               emoji: '🐉', color: '#a16207', weight: 1 },
  { text: 'Pico o mochila a elegir',    emoji: '⛏️', color: '#4c1d95', weight: 1 }
];
const DEFAULTS = {
  duration: 14,
  password: 'dragon',
  removeOnWin: false,
  muted: false,
  current: 'normal',
  wheels: {
    normal: { title: 'Ruleta del Dragón', subtitle: 'Retos y premios', image: '', items: NORMAL_ITEMS },
    legend: { title: 'Ruleta Legendaria', subtitle: 'Premios épicos', image: '', items: LEGEND_ITEMS }
  }
};

/* ---------- Estado / persistencia ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) return fromData(JSON.parse(raw)); }catch(e){}
  return clone(DEFAULTS);
}
function fromData(d){
  const def = clone(DEFAULTS);
  try{
    if(d){
      if(!d.wheels && Array.isArray(d.items)) d.wheels = { normal: { title: d.title, subtitle: d.subtitle, items: d.items } }; // formato antiguo
      const wheels = {};
      for(const k of ['normal','legend']){
        const w = (d.wheels && d.wheels[k]) || {};
        wheels[k] = { ...def.wheels[k], ...w, items: Array.isArray(w.items) && w.items.length >= 2 ? w.items : def.wheels[k].items };
      }
      if(!d.duration || d.duration < 14) d.duration = 14;
      return { ...def, ...d, wheels, current: d.current === 'legend' ? 'legend' : 'normal' };
    }
  }catch(e){}
  return def;
}
/* ---------- Base de datos (Supabase, ver db.js) ---------- */
const PAGE = 'ruleta';
const PRIVATE = ['password','muted','current'];                 // nunca se suben a la BBDD
let sessionPwd = '', remoteEmpty = false;
let onSaved = ok => { if(ok) KDB.toast('✓ Guardado en la base de datos'); };
const publicData = () => { const o = clone(state); PRIVATE.forEach(k => delete o[k]); return o; };
function saveLocal(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); return true; }catch(e){ return false; } }
function save(){
  const okLocal = saveLocal();
  if(KDB.enabled && sessionPwd){
    KDB.save(PAGE, publicData(), () => sessionPwd).then(() => onSaved(true)).catch(err => { onSaved(false); KDB.toast('⚠ No se guardó: ' + err.message, false); });
    return true;
  }
  return okLocal;
}
let state = load();
const W = () => state.wheels[state.current];
let rotation = 0, spinning = false, swapping = false, unlocked = false, lastWinner = -1;
const history = [];

if(new URLSearchParams(location.search).has('obs')) document.body.classList.add('obs');

/* ---------- Utilidades de color ---------- */
function hexToRgb(h){ h = h.replace('#',''); if(h.length===3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; }
function mix(hex, target, amt){ const [r,g,b] = hexToRgb(hex); const t = target==='w'?255:0; return `rgb(${Math.round(r+(t-r)*amt)},${Math.round(g+(t-g)*amt)},${Math.round(b+(t-b)*amt)})`; }

/* ---------- Bombillas y venas ---------- */
const ring = $('#ring');
for(let i=0;i<28;i++){
  const a = i/28*Math.PI*2, b = document.createElement('span');
  b.className='bulb'; b.style.left = (50+Math.cos(a)*44.6)+'%'; b.style.top = (50+Math.sin(a)*44.6)+'%';
  ring.appendChild(b);
}

/* ---------- Dibujo de la rueda ---------- */
const wheel = $('#wheel'), ctx = wheel.getContext('2d');
let segs = [];

function scalePattern(size){
  const c = document.createElement('canvas'); c.width = size; c.height = size; const x = c.getContext('2d');
  const h = size/2;
  x.lineWidth = Math.max(1, size/16);
  const arc = (cx,cy) => { x.beginPath(); x.arc(cx,cy,h,0,Math.PI); x.strokeStyle='rgba(0,0,0,.35)'; x.stroke();
    x.beginPath(); x.arc(cx,cy-x.lineWidth,h*.92,Math.PI*.15,Math.PI*.85); x.strokeStyle='rgba(255,230,160,.10)'; x.stroke(); };
  arc(h,0); arc(0,h); arc(size,h); arc(h,size);
  return c;
}

function computeSegs(){
  const total = W().items.reduce((s,it)=>s+Math.max(0.1, +it.weight||1),0);
  let acc = 0;
  segs = W().items.map(it => { const size = Math.max(0.1,+it.weight||1)/total*360; const s = { start: acc, size, item: it }; acc += size; return s; });
}

function wrapLines(text, maxW){
  const words = text.toUpperCase().split(/\s+/); const lines = []; let line = '';
  for(const w of words){ const t = line ? line+' '+w : w; if(ctx.measureText(t).width > maxW && line){ lines.push(line); line = w; } else line = t; }
  if(line) lines.push(line); return lines;
}

function drawWheel(){
  computeSegs();
  const dpr = window.devicePixelRatio || 1, px = wheel.clientWidth;
  wheel.width = wheel.height = Math.round(px*dpr);
  const r = wheel.width/2;
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,wheel.width,wheel.height);
  ctx.translate(r,r);
  const toRad = d => (d-90)*Math.PI/180;

  // segmentos
  segs.forEach(s => {
    const a0 = toRad(s.start), a1 = toRad(s.start+s.size);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,a0,a1); ctx.closePath();
    const g = ctx.createRadialGradient(0,0,r*.12,0,0,r);
    g.addColorStop(0, mix(s.item.color,'w',.28)); g.addColorStop(.55, s.item.color); g.addColorStop(1, mix(s.item.color,'b',.5));
    ctx.fillStyle = g; ctx.fill();
  });

  // escamas
  ctx.save(); ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.clip();
  ctx.fillStyle = ctx.createPattern(scalePattern(Math.round(r*.09)), 'repeat'); ctx.globalAlpha = .9;
  ctx.fillRect(-r,-r,r*2,r*2); ctx.restore();

  // separadores dorados
  const gold = ctx.createLinearGradient(-r,-r,r,r);
  gold.addColorStop(0,'#ffe7a0'); gold.addColorStop(.5,'#b8741a'); gold.addColorStop(1,'#ffe7a0');
  if(segs.length > 1) segs.forEach(s => {
    const a = toRad(s.start);
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r);
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = r*.022; ctx.stroke();
    ctx.strokeStyle = gold; ctx.lineWidth = r*.01; ctx.stroke();
  });

  // viñeta interior y borde
  const v = ctx.createRadialGradient(0,0,r*.7,0,0,r);
  v.addColorStop(0,'rgba(0,0,0,0)'); v.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();

  // textos y emojis
  segs.forEach(s => {
    const mid = toRad(s.start + s.size/2), sweep = s.size*Math.PI/180;
    ctx.save(); ctx.rotate(mid);
    const hasEmoji = !!(s.item.emoji||'').trim();
    const outer = hasEmoji ? r*.72 : r*.9;
    let fs = Math.min(r*.075, r*.62*sweep*.34), lines;
    for(let k=0;k<12;k++){
      ctx.font = `900 ${fs}px Cinzel, serif`;
      lines = wrapLines(s.item.text||'', outer - r*.36);
      const tooWide = lines.some(l => ctx.measureText(l).width > outer - r*.36);
      if(lines.length <= 3 && !tooWide && lines.length*fs*1.1 < r*.6*sweep*1.05) break;
      fs *= .9;
    }
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = fs*.22; ctx.strokeStyle = 'rgba(20,2,0,.85)';
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = fs*.3;
    const lh = fs*1.08, y0 = -(lines.length-1)*lh/2;
    lines.forEach((l,i) => {
      ctx.strokeText(l, outer, y0+i*lh);
      const tg = ctx.createLinearGradient(0, y0+i*lh-fs/2, 0, y0+i*lh+fs/2);
      tg.addColorStop(0,'#ffffff'); tg.addColorStop(1,'#ffe08a');
      ctx.fillStyle = tg; ctx.fillText(l, outer, y0+i*lh);
    });
    if(hasEmoji){
      const es = Math.min(r*.12, r*.84*sweep*.55);
      ctx.save(); ctx.translate(r*.83,0); ctx.rotate(Math.PI/2);
      ctx.font = `${es}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
      ctx.textAlign = 'center'; ctx.shadowColor = 'rgba(0,0,0,.7)'; ctx.shadowBlur = es*.25;
      ctx.fillText(s.item.emoji, 0, 0); ctx.restore();
    }
    ctx.restore();
  });

  wheel.style.transform = `rotate(${rotation}deg)`;
}

/* ---------- Sonido ---------- */
let ac = null;
const audio = () => (ac ||= new (window.AudioContext||window.webkitAudioContext)());
function tone(freq, dur, type='square', vol=.06, when=0){
  if(state.muted) return; const a = audio(), t = a.currentTime+when;
  const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur);
}
const tick = () => tone(1100 + Math.random()*200, .035, 'square', .04);
function roar(){
  if(state.muted) return; const a = audio(), t = a.currentTime;
  const len = a.sampleRate*1.1, buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*(1-i/len);
  const n = a.createBufferSource(); n.buffer = buf;
  const f = a.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(300,t); f.frequency.exponentialRampToValueAtTime(1800,t+.25); f.frequency.exponentialRampToValueAtTime(200,t+1.1);
  const g = a.createGain(); g.gain.setValueAtTime(.35,t); g.gain.exponentialRampToValueAtTime(.001,t+1.1);
  n.connect(f).connect(g).connect(a.destination); n.start(t);
  tone(90,.9,'sawtooth',.12);
  [523,659,784,1047].forEach((fq,i)=>tone(fq,.5,'triangle',.08,.15+i*.09));
}

/* ---------- Giro ---------- */
const wrap = $('#wheelWrap'), pointer = $('#pointer'), spinBtn = $('#hub');
const segAt = deg => { for(let i=0;i<segs.length;i++) if(deg >= segs[i].start && deg < segs[i].start+segs[i].size) return i; return segs.length-1; };

function pickWeighted(){
  const total = W().items.reduce((s,it)=>s+Math.max(.1,+it.weight||1),0);
  let r = Math.random()*total;
  for(let i=0;i<W().items.length;i++){ r -= Math.max(.1,+W().items[i].weight||1); if(r <= 0) return i; }
  return W().items.length-1;
}

function spin(){
  if(spinning || swapping || W().items.length < 2 || document.querySelector('.modal.show')) return;
  spinning = true; spinBtn.disabled = true;
  wrap.classList.remove('win'); wrap.classList.add('spinning');
  try{ audio().resume(); }catch(e){}

  const win = pickWeighted(), s = segs[win];
  const theta = s.start + s.size*(.15 + Math.random()*.7);
  const dur = Math.max(3, +state.duration||14)*1000;
  const spins = 8 + Math.round(dur/1000);
  const from = rotation;
  let to = from - (((from%360)+360)%360) + spins*360 + ((360-theta)%360);
  while(to - from < spins*360 - 360) to += 360;

  const t0 = performance.now(); let lastSeg = -1;
  const ease = p => 1 - Math.pow(1-p, 5);
  (function frame(now){
    const p = Math.min(1,(now-t0)/dur), ang = from + (to-from)*ease(p);
    wheel.style.transform = `rotate(${ang}deg)`;
    const idx = segAt(((-ang)%360+360)%360);
    if(idx !== lastSeg){ if(lastSeg !== -1){ tick(); pointer.classList.remove('tick'); void pointer.offsetWidth; pointer.classList.add('tick'); } lastSeg = idx; }
    if(p < 1) requestAnimationFrame(frame);
    else { rotation = to; finish(win); }
  })(t0);
}

function finish(i){
  spinning = false; lastWinner = i;
  wrap.classList.remove('spinning'); wrap.classList.add('win');
  const it = W().items[i];
  $('#resultEmoji').textContent = it.emoji || '🐉';
  $('#resultText').textContent = it.text;
  $('#resultModal').classList.add('show');
  roar(); burst();
  history.unshift(`${it.emoji||''} ${it.text}`.trim()); if(history.length > 6) history.pop();
  renderHistory();
}

$('#resultOk').onclick = () => {
  $('#resultModal').classList.remove('show'); wrap.classList.remove('win');
  if(state.removeOnWin && lastWinner > -1 && W().items.length > 2){ W().items.splice(lastWinner,1); save(); drawWheel(); }
  spinBtn.disabled = W().items.length < 2;
};

function renderHistory(){
  const h = $('#history'); h.innerHTML = '';
  history.forEach(t => { const c = document.createElement('span'); c.className='chip'; c.textContent = t; h.appendChild(c); });
}

spinBtn.onclick = spin; $('#hub').onclick = spin;
document.addEventListener('keydown', e => { if(e.code==='Space' && !document.querySelector('.modal.show') && !['INPUT','TEXTAREA','BUTTON'].includes(e.target.tagName)){ e.preventDefault(); spin(); } });

/* ---------- Brasas ---------- */
const ec = $('#embers'), ex = ec.getContext('2d'); let parts = [];
function resizeEmbers(){ ec.width = innerWidth; ec.height = innerHeight; }
function ember(x,y,vx,vy,life,size){ parts.push({x,y,vx,vy,life,max:life,size,h:(state.current==='legend'?250:15)+Math.random()*30}); }
function burst(){
  const rc = wrap.getBoundingClientRect(), cx = rc.left+rc.width/2, cy = rc.top+rc.height/2;
  for(let i=0;i<180;i++){ const a = Math.random()*Math.PI*2, sp = 2+Math.random()*9; ember(cx,cy,Math.cos(a)*sp,Math.sin(a)*sp-2,60+Math.random()*60,2+Math.random()*4); }
}
(function loop(){
  ex.clearRect(0,0,ec.width,ec.height);
  if(parts.length < 400 && Math.random() < .6) ember(Math.random()*ec.width, ec.height+10, (Math.random()-.5)*.6, -(.6+Math.random()*1.6), 200+Math.random()*200, 1+Math.random()*2.5);
  ex.globalCompositeOperation = 'lighter';
  parts = parts.filter(p => {
    p.x += p.vx + Math.sin(p.life*.05)*.3; p.y += p.vy; p.vy -= .01; p.vx *= .99; p.life--;
    const a = Math.max(0,p.life/p.max);
    const g = ex.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*3);
    g.addColorStop(0,`hsla(${p.h+20},100%,75%,${a})`); g.addColorStop(.4,`hsla(${p.h},100%,50%,${a*.6})`); g.addColorStop(1,'hsla(0,100%,40%,0)');
    ex.fillStyle = g; ex.beginPath(); ex.arc(p.x,p.y,p.size*3,0,Math.PI*2); ex.fill();
    return p.life > 0;
  });
  ex.globalCompositeOperation = 'source-over';
  requestAnimationFrame(loop);
})();

/* ---------- Fuego detrás de la rueda ---------- */
const fc = $('#fireBack'), fx = fc.getContext('2d'); let flames = [], fireLevel = 0;
function resizeFire(){ const d = Math.min(2, window.devicePixelRatio||1); fc.width = fc.clientWidth*d; fc.height = fc.clientHeight*d; }
(function fireLoop(){
  const target = (spinning || swapping) ? 1 : (wrap.classList.contains('win') ? .6 : 0);
  fireLevel += (target - fireLevel) * (target > fireLevel ? .08 : .02);
  const W = fc.width, H = fc.height, cx = W/2, cy = H*(0.55+0.5)/1.7, R = W/1.8*0.5;
  fx.clearRect(0,0,W,H);
  if(fireLevel > .01){
    const n = Math.round(14*fireLevel);
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, rr = R*(.8+Math.random()*.22);
      flames.push({ x: cx+Math.cos(a)*rr, y: cy+Math.sin(a)*rr,
        vx: Math.cos(a)*(1+Math.random()*2)*W/900, vy: (Math.sin(a)*1.5 - 3 - Math.random()*4)*W/900,
        life: 1, decay: .012+Math.random()*.02, size: (18+Math.random()*34)*W/900*(.6+fireLevel*.6) });
    }
    // resplandor
    const glow = fx.createRadialGradient(cx,cy,R*.6,cx,cy,R*1.5);
    const hu = state.current === 'legend' ? 270 : 25;
    glow.addColorStop(0,`hsla(${hu},100%,50%,${.45*fireLevel})`); glow.addColorStop(1,`hsla(${hu-15},100%,45%,0)`);
    fx.fillStyle = glow; fx.fillRect(0,0,W,H);
  }
  fx.globalCompositeOperation = 'lighter';
  flames = flames.filter(f => {
    f.x += f.vx + Math.sin(f.life*20)*.4; f.y += f.vy; f.vy -= .06*W/900; f.life -= f.decay;
    if(f.life <= 0) return false;
    const s = f.size*(.4+f.life*.8), l = f.life;
    const g = fx.createRadialGradient(f.x,f.y,0,f.x,f.y,s);
    const hu = state.current === 'legend' ? 270 : 25;
    g.addColorStop(0,`hsla(${hu+25},100%,${70+25*l}%,${.9*l})`);
    g.addColorStop(.35,`hsla(${hu},100%,${45+15*l}%,${.6*l})`);
    g.addColorStop(1,`hsla(${hu-20},100%,35%,0)`);
    fx.fillStyle = g; fx.beginPath(); fx.arc(f.x,f.y,s,0,Math.PI*2); fx.fill();
    return true;
  });
  fx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(fireLoop);
})();

/* ---------- Textos / sonido ---------- */
const eyeEl = $('.eye-img'), DEFAULT_EYE_BG = getComputedStyle(eyeEl).backgroundImage;
const cssUrl = u => `url("${String(u).replace(/"/g,'%22')}")`;
function applyEye(){
  const img = W().image;
  eyeEl.style.backgroundImage = img ? cssUrl(img) : '';
  eyeEl.style.backgroundSize = img ? 'cover' : '';
  eyeEl.style.backgroundPosition = img ? 'center' : '';
}
function applyTexts(){ const w = W(); $('#titleText').textContent = w.title; $('#subtitleText').textContent = w.subtitle; document.title = w.title;
  document.body.classList.toggle('legend', state.current === 'legend');
  $('#swapBtn').textContent = state.current === 'legend' ? 'Legendaria' : 'Normal';
  applyEye(); $('#muteBtn').textContent = state.muted ? '🔇' : '🔊'; }
$('#muteBtn').onclick = () => { state.muted = !state.muted; saveLocal(); applyTexts(); };

/* ---------- Cambio de ruleta (giro 3D) ---------- */
function whoosh(){
  if(state.muted) return; const a = audio(), t = a.currentTime;
  const len = a.sampleRate*1.3, buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.sin(Math.PI*i/len);
  const n = a.createBufferSource(); n.buffer = buf;
  const f = a.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4;
  f.frequency.setValueAtTime(180,t); f.frequency.exponentialRampToValueAtTime(3200,t+.55); f.frequency.exponentialRampToValueAtTime(260,t+1.3);
  const g = a.createGain(); g.gain.value = .55;
  n.connect(f).connect(g).connect(a.destination); n.start(t);
}
function swapWheel(){
  if(spinning || swapping || document.querySelector('.modal.show')) return;
  swapping = true; spinBtn.disabled = true; $('#swapBtn').disabled = true;
  wrap.classList.remove('win');
  try{ audio().resume(); }catch(e){}
  whoosh();
  const P = 'perspective(1600px) ';
  const out = wrap.animate([
    { transform: P+'rotateY(0deg) rotateZ(0deg) scale(1)' },
    { transform: P+'rotateY(90deg) rotateZ(-25deg) scale(.8)' }
  ], { duration: 560, easing: 'cubic-bezier(.55,0,.9,.35)', fill: 'forwards' });
  out.onfinish = () => {
    state.current = state.current === 'legend' ? 'normal' : 'legend';
    saveLocal(); rotation = 0; applyTexts(); drawWheel(); burst();
    const inn = wrap.animate([
      { transform: P+'rotateY(-90deg) rotateZ(25deg) scale(.8)' },
      { transform: P+'rotateY(14deg) rotateZ(-3deg) scale(1.06)', offset: .7 },
      { transform: P+'rotateY(0deg) rotateZ(0deg) scale(1)' }
    ], { duration: 850, easing: 'cubic-bezier(.2,.7,.3,1)', fill: 'forwards' });
    inn.onfinish = () => {
      out.cancel(); inn.cancel();
      swapping = false; spinBtn.disabled = W().items.length < 2; $('#swapBtn').disabled = false;
      if(state.current === 'legend') roar();
    };
  };
}
$('#swapBtn').onclick = swapWheel;

/* ---------- Admin ---------- */
let draft = null, adminTab = 'normal';
const DW = () => draft.wheels[adminTab];
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $('#'+b.dataset.close).classList.remove('show'));

$('#adminBtn').onclick = () => {
  if(unlocked) return openAdmin();
  $('#pwd').value = ''; $('#loginErr').textContent = ''; $('#loginModal').classList.add('show'); setTimeout(()=>$('#pwd').focus(),50);
};
async function tryLogin(){
  const pwd = $('#pwd').value; let ok;
  if(KDB.enabled){
    $('#loginErr').textContent = 'Comprobando…';
    try{ ok = await KDB.login(PAGE, pwd); }catch(e){ $('#loginErr').textContent = 'Error de conexión: ' + e.message; return; }
  } else ok = pwd === state.password;
  if(ok){
    sessionPwd = pwd; unlocked = true; $('#loginErr').textContent = ''; $('#loginModal').classList.remove('show');
    if(remoteEmpty){ remoteEmpty = false; save(); }   // primera vez: sube lo que había en este navegador
    openAdmin();
  }
  else $('#loginErr').textContent = 'Contraseña incorrecta';
}
$('#loginBtn').onclick = tryLogin;
$('#pwd').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); tryLogin(); } });

function openAdmin(){
  draft = clone(state); adminTab = state.current;
  $('#aPassword').value = '';
  openAdminFromDraft();
  $('#adminModal').classList.add('show');
}
function renderAdminWheel(){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === adminTab));
  $('#aTitle').value = DW().title || ''; $('#aSubtitle').value = DW().subtitle || '';
  $('#imgUrl').value = (DW().image || '').startsWith('data:') ? '' : (DW().image || '');
  updPrev(); renderItems();
}
function updPrev(){ const i = DW().image; $('#imgPrev').style.backgroundImage = i ? cssUrl(i) : DEFAULT_EYE_BG; $('#imgPrev').style.backgroundSize = i ? 'cover' : '135%'; $('#imgPrev').style.backgroundPosition = i ? 'center' : 'center 62%'; }
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { adminTab = t.dataset.tab; renderAdminWheel(); });
$('#aTitle').oninput = () => DW().title = $('#aTitle').value;
$('#aSubtitle').oninput = () => DW().subtitle = $('#aSubtitle').value;
$('#imgUpload').onclick = () => $('#imgFile').click();
$('#imgFile').onchange = e => {
  const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  if(!f.type.startsWith('image/')){ $('#adminErr').textContent = 'Ese archivo no es una imagen.'; return; }
  if(f.size > 2.5*1024*1024){ $('#adminErr').textContent = 'La imagen pesa más de 2,5 MB. Usa una URL o una más ligera.'; return; }
  const rd = new FileReader();
  rd.onload = () => { DW().image = rd.result; $('#imgUrl').value = ''; $('#adminErr').textContent = ''; updPrev(); };
  rd.readAsDataURL(f);
};
$('#imgUrl').oninput = () => { DW().image = $('#imgUrl').value.trim(); updPrev(); };
$('#imgClear').onclick = () => { DW().image = ''; $('#imgUrl').value = ''; updPrev(); };

function renderItems(){
  const list = $('#itemsList'); list.innerHTML = '';
  const total = DW().items.reduce((s,it)=>s+Math.max(.1,+it.weight||1),0);
  DW().items.forEach((it,i) => {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `
      <input type="color" value="${it.color}">
      <input type="text" class="emoji" maxlength="8" placeholder="🐉">
      <input type="text" class="txt" placeholder="Texto del premio o reto">
      <input type="number" min="0.1" step="0.5" title="Peso">
      <div class="acts">
        <button class="btn sm" data-a="up" title="Subir">▲</button>
        <button class="btn sm" data-a="down" title="Bajar">▼</button>
        <button class="btn sm danger" data-a="del" title="Eliminar">✕</button>
      </div>
      <div class="pct">${(Math.max(.1,+it.weight||1)/total*100).toFixed(1)}% de probabilidad</div>`;
    const [color, emoji, txt, w] = row.querySelectorAll('input');
    emoji.value = it.emoji || ''; txt.value = it.text || ''; w.value = it.weight;
    color.oninput = () => it.color = color.value;
    emoji.oninput = () => it.emoji = emoji.value;
    txt.oninput = () => it.text = txt.value;
    w.onchange = () => { it.weight = Math.max(.1, parseFloat(w.value)||1); renderItems(); };
    row.querySelector('[data-a=up]').onclick = () => { if(i>0){ [DW().items[i-1],DW().items[i]] = [DW().items[i],DW().items[i-1]]; renderItems(); } };
    row.querySelector('[data-a=down]').onclick = () => { if(i<DW().items.length-1){ [DW().items[i+1],DW().items[i]] = [DW().items[i],DW().items[i+1]]; renderItems(); } };
    row.querySelector('[data-a=del]').onclick = () => { DW().items.splice(i,1); renderItems(); };
    list.appendChild(row);
  });
}

const PALETTE = ['#c92a2a','#f08c00','#2f9e44','#7a0f0f','#d9480f','#8c5a12','#1b6b34','#e67700','#a61e4d','#5c940d'];
$('#addItem').onclick = () => { DW().items.push({ text:'Nuevo premio', emoji:'🐉', color: PALETTE[DW().items.length % PALETTE.length], weight:1 }); renderItems(); $('#itemsList').lastElementChild?.querySelector('.txt').select(); };

$('#saveBtn').onclick = () => {
  for(const k of ['normal','legend']){
    const w = draft.wheels[k];
    w.items = w.items.filter(it => (it.text||'').trim());
    if(w.items.length < 2){ adminTab = k; renderAdminWheel(); $('#adminErr').textContent = `La ruleta ${k==='legend'?'legendaria':'normal'} necesita al menos 2 premios con texto.`; return; }
    w.title = (w.title||'').trim() || DEFAULTS.wheels[k].title;
    w.subtitle = (w.subtitle||'').trim();
  }
  draft.duration = Math.min(40, Math.max(3, parseFloat($('#aDuration').value)||14));
  draft.removeOnWin = $('#aRemove').checked;
  const np = $('#aPassword').value.trim();
  if(np){
    if(KDB.enabled) KDB.changePassword(PAGE, () => sessionPwd, np, () => { sessionPwd = np; KDB.toast('✓ Contraseña cambiada'); }).catch(e => KDB.toast('⚠ ' + e.message, false));
    else draft.password = np;
  }
  draft.muted = state.muted;
  draft.current = state.current;
  const prev = state; state = draft;
  if(!save()){ state = prev; $('#adminErr').textContent = 'No se pudo guardar: las imágenes ocupan demasiado. Usa una URL o una imagen más ligera.'; return; }
  applyTexts(); drawWheel();
  spinBtn.disabled = W().items.length < 2;
  $('#adminModal').classList.remove('show');
};

let resetArmed = null;
$('#resetBtn').onclick = () => {
  const b = $('#resetBtn');
  if(!resetArmed){ b.textContent = '¿Seguro? Pulsa otra vez'; resetArmed = setTimeout(()=>{ resetArmed = null; b.textContent = 'Restaurar'; }, 3000); return; }
  clearTimeout(resetArmed); resetArmed = null; b.textContent = 'Restaurar';
  const pwd = draft.password; draft = clone(DEFAULTS); draft.password = pwd; draft.muted = state.muted; openAdminFromDraft();
};
function openAdminFromDraft(){ $('#aDuration').value = draft.duration; $('#aRemove').checked = !!draft.removeOnWin; $('#adminErr').textContent = ''; renderAdminWheel(); }

$('#exportBtn').onclick = () => {
  const { password, ...data } = draft;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download = 'ruleta-dragon.json'; a.click(); URL.revokeObjectURL(a.href);
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const d = JSON.parse(rd.result);
      const clean = arr => arr.map(it => ({ text:String(it.text||''), emoji:String(it.emoji||''), color:/^#[0-9a-f]{3,6}$/i.test(it.color)?it.color:'#c92a2a', weight:Math.max(.1,+it.weight||1) }));
      let ok = false;
      if(d.wheels){
        for(const k of ['normal','legend']){
          const w = d.wheels[k];
          if(w && Array.isArray(w.items) && w.items.length >= 2){ draft.wheels[k] = { title:String(w.title||DEFAULTS.wheels[k].title), subtitle:String(w.subtitle||''), image:String(w.image||''), items:clean(w.items) }; ok = true; }
        }
      } else if(Array.isArray(d.items) && d.items.length >= 2){ DW().items = clean(d.items); ok = true; }
      if(!ok) throw 0;
      if(d.duration) draft.duration = Math.min(40, Math.max(3, +d.duration||14));
      if('removeOnWin' in d) draft.removeOnWin = !!d.removeOnWin;
      openAdminFromDraft();
    }catch(err){ $('#adminErr').textContent = 'Archivo no válido.'; }
  };
  rd.readAsText(f); e.target.value = '';
};

/* ---------- Init ---------- */
applyTexts(); drawWheel();

/* ---------- Cargar de la BBDD y escuchar cambios de otros dispositivos ---------- */
if(KDB.enabled){
  const apply = d => { const keep = { password: state.password, muted: state.muted, current: state.current }; state = { ...fromData(d), ...keep }; saveLocal(); if(!spinning && !swapping){ applyTexts(); drawWheel(); spinBtn.disabled = W().items.length < 2; } };
  KDB.load(PAGE).then(row => {
    if(row && row.data && Object.keys(row.data).length) apply(row.data);
    else remoteEmpty = true;
  }).catch(e => KDB.toast('⚠ ' + e.message, false));
  KDB.watch(PAGE, apply, () => !!document.querySelector('.modal.show') || spinning || swapping);
}
resizeEmbers(); resizeFire();
addEventListener('resize', () => { resizeEmbers(); resizeFire(); drawWheel(); });
document.fonts && document.fonts.ready.then(drawWheel);
})();
</script>
</body>
