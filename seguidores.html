<title>Seguidores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Metal+Mania&display=swap" rel="stylesheet">
<style>
:root{--gold:#f5c451;--gold-dark:#8a5a12}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Cinzel',serif;color:#fff;min-height:100vh;overflow-x:hidden;
  background:radial-gradient(ellipse at 50% 30%,rgba(160,25,5,.55) 0%,rgba(40,4,2,.9) 45%,#050101 80%),radial-gradient(circle at 50% 110%,rgba(255,90,0,.35),transparent 50%),#050101;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.10;background-image:radial-gradient(circle at 50% 0,transparent 55%,#ff9a3c 57%,transparent 62%);background-size:34px 22px}
#embers{position:fixed;inset:0;pointer-events:none;z-index:0}
.page{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:60px 16px 90px}
.title{font-family:'Metal Mania',cursive;font-weight:400;text-align:center;line-height:1;font-size:clamp(2.4rem,7vw,4.4rem);letter-spacing:2px;
  background:linear-gradient(180deg,#fff6c2 0%,#ffc53d 35%,#ff5a00 70%,#a80f07 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 14px rgba(255,80,0,.75)) drop-shadow(0 3px 0 #2a0402)}
.subtitle{margin-top:6px;color:var(--gold);letter-spacing:6px;text-transform:uppercase;font-size:clamp(.75rem,2vw,1rem);text-shadow:0 0 10px rgba(255,120,0,.8);text-align:center}
.back{position:fixed;top:14px;left:14px;z-index:20;font-family:'Cinzel',serif;font-weight:700;font-size:.85rem;letter-spacing:2px;text-decoration:none;color:#ffe3a0;
  padding:9px 18px;border-radius:30px;border:2px solid var(--gold-dark);background:rgba(20,4,2,.85);transition:.2s}
.back:hover{border-color:var(--gold);color:#fff;box-shadow:0 0 12px rgba(255,150,0,.6)}
.corner{position:fixed;right:14px;bottom:14px;z-index:20}
.corner button{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold-dark);background:rgba(20,4,2,.85);font-size:1.2rem;cursor:pointer;transition:.2s}
.corner button:hover{border-color:var(--gold);box-shadow:0 0 12px rgba(255,150,0,.6)}
body.obs .corner,body.obs .back{display:none}
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(0,0,0,.72);backdrop-filter:blur(4px)}
.modal.show{display:flex}
.card{position:relative;background:linear-gradient(180deg,#2a0704,#120302);border:2px solid var(--gold);border-radius:18px;padding:26px;
  box-shadow:0 0 40px rgba(255,80,0,.5),inset 0 0 30px rgba(0,0,0,.8);width:100%;max-width:440px;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.card h2{font-family:'Metal Mania',cursive;font-weight:400;font-size:2rem;text-align:center;margin-bottom:14px;
  background:linear-gradient(180deg,#fff3b0,#ffb300 45%,#ff4d00);-webkit-background-clip:text;background-clip:text;color:transparent}
.admin-card{max-width:820px;max-height:92vh;overflow:auto}

/* ===== PESTAÑAS SEGUIDORES / ESPÍRITUS ===== */
.ktabs{display:flex;justify-content:center;gap:8px;margin:0 auto 18px;flex-wrap:wrap}
.ktabs a{font-family:'Cinzel',serif;font-weight:900;font-size:.85rem;letter-spacing:2px;text-decoration:none;color:#ffe3a0;padding:9px 20px;border-radius:30px;border:2px solid var(--gold-dark);background:rgba(20,4,2,.85);transition:.2s}

/* ===== SEGUIDORES ===== */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;margin-top:26px}

  background:linear-gradient(180deg,#2a0704,#120302);border:2px solid var(--gold-dark);box-shadow:0 10px 26px rgba(0,0,0,.6),inset 0 0 26px rgba(0,0,0,.7);transition:transform .2s,border-color .2s}

.fbar i.on{background:linear-gradient(180deg,color-mix(in srgb,var(--lc) 70%,#fff),var(--lc));box-shadow:0 0 8px var(--lc)}

/* regalos */
.fgifts{display:flex;flex-wrap:wrap;gap:6px}
.gift{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:.78rem;font-weight:700;color:#fff;
  background:rgba(255,179,0,.12);border:1px solid rgba(245,196,81,.5)}
.gift.lost{color:#8a6a5a;background:rgba(0,0,0,.35);border-color:#4a2a12;text-decoration:line-through;text-decoration-color:#ff4a4a;text-decoration-thickness:2px}

  background:rgba(20,4,2,.92);border:1px solid var(--gold);box-shadow:0 6px 20px rgba(0,0,0,.6)}
.edbar input,.edbar select{width:auto;flex:1;min-width:160px}

<script src="db.js"></script>
<script src="timer.js"></script>
<script src="auth.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const KEY = 'karreSeguidores_v1', PAGE = 'seguidores';
const DEFAULTS = {
  title: 'Seguidores',
  subtitle: 'Fieles a la guarida',
  maxLives: 7,          // vidas de fidelidad; se pierde una cada día
  password: 'dragon',   // solo sin base de datos
  followers: []         // [{ key, name, lives, base:'AAAA-MM-DD', gifts:[{ id, emoji, text, date, lost }], lostWins:[ids] }]
};
const norm = n => String(n || '').trim().toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const fromData = d => {
  const o = { ...clone(DEFAULTS), ...(d && typeof d === 'object' ? d : {}) };
  if(!Array.isArray(o.followers)) o.followers = [];
  o.followers.forEach(f => { f.key = f.key || norm(f.name); if(!Array.isArray(f.gifts)) f.gifts = []; if(!Array.isArray(f.lostWins)) f.lostWins = []; });
  o.maxLives = Math.max(1, Math.min(60, +o.maxLives || 7)); return o;
};
const load = () => { try{ return fromData(JSON.parse(localStorage.getItem(KEY))); }catch(e){ return clone(DEFAULTS); } };
let state = load(), editing = false, dirty = false, sessionPwd = '', remoteEmpty = false;
let rank = [], ruleta = { winners: [], items: [] };   // datos de las otras páginas (solo lectura)
if(new URLSearchParams(location.search).has('obs')) document.body.classList.add('obs');

/* ---------- Guardar ---------- */
const publicData = () => { const o = clone(state); delete o.password; return o; };
const saveLocal = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); return true; }catch(e){ return false; } };
function save(){
  const ok = saveLocal();
  if(KDB.enabled && sessionPwd){ KDB.save(PAGE, publicData(), () => sessionPwd).then(() => KDB.toast('✓ Guardado')).catch(e => KDB.toast('⚠ No se guardó: ' + e.message, false)); return true; }
  return ok;
}

/* ---------- Ranking (quién existe) y ruleta (premios y ganadores) ---------- */
async function loadLinked(){
  try{
    let rk, rl;
    if(KDB.enabled){ const [a, b] = await Promise.all([KDB.load('ranking'), KDB.load('ruleta')]); rk = a && a.data; rl = b && b.data; }
    else { rk = JSON.parse(localStorage.getItem('karreRanking_v1') || 'null'); rl = JSON.parse(localStorage.getItem('ruletaDragon_v1') || 'null'); }
    rank = ((rk && rk.players) || []).filter(p => (p.name || '').trim()).map(p => ({ key: norm(p.name), name: p.name.trim(), avatar: p.avatar || '' }))
      .sort((x, y) => x.name.localeCompare(y.name));
    const items = []; const seen = new Set();
    ['normal', 'legend'].forEach(k => (((rl && rl.wheels && rl.wheels[k]) || {}).items || []).forEach(it => { const t = (it.text || '').trim(); if(t && !seen.has(t)){ seen.add(t); items.push({ text: t, emoji: it.emoji || '🎁' }); } }));
    ruleta = { winners: (rl && rl.winners) || [], items };
  }catch(e){}
  render();
}

/* ---------- Fidelidad: se pierde una vida cada día ---------- */
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => iso(new Date());
const dayNum = s => { const [y, m, d] = String(s || today()).split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const lifeOf = f => Math.max(0, Math.min(state.maxLives, (+f.lives || 0) - Math.max(0, dayNum(today()) - dayNum(f.base))));
const zeroDay = f => dayNum(f.base) + Math.max(0, +f.lives || 0);   // día en que se queda (o se quedó) a 0
// premios de la ruleta que le han tocado y aún no se le han entregado
const winsOf = f => ruleta.winners.filter(w => norm(w.winner) === f.key && !w.delivered)
  .map(w => ({ id: 'w_' + w.id, text: w.prize || '', date: w.date || '', emoji: (ruleta.items.find(it => it.text === w.prize) || {}).emoji || '🎡', wheel: true }));
// al llegar a 0, los regalos que tenía hasta ese día quedan perdidos para siempre (aunque luego recargues)
function commitLoss(f){
  if(lifeOf(f) > 0) return;
  const z = zeroDay(f);
  f.gifts.forEach(g => { if(dayNum(g.date) <= z) g.lost = true; });
  winsOf(f).forEach(w => { if(dayNum(w.date) <= z && !f.lostWins.includes(w.id)) f.lostWins.push(w.id); });
}
function setLives(f, n){ commitLoss(f); f.lives = Math.max(0, Math.min(state.maxLives, n)); f.base = today(); if(f.lives === 0) commitLoss(f); }
const lifeColor = (l, m) => l / m > .5 ? '#39dc5a' : l / m > .25 ? '#ffb300' : '#ff3b3b';
const newId = () => Math.random().toString(36).slice(2, 9);
const cssUrl = u => `url("${String(u).replace(/"/g, '%22')}")`;

/* ---------- Pintar ---------- */
function render(){
  $('#titleText').textContent = state.title || 'Seguidores'; $('#subtitleText').textContent = state.subtitle || ''; document.title = state.title || 'Seguidores';
  const list = [...state.followers].sort((a, b) => (lifeOf(b) > 0) - (lifeOf(a) > 0) || lifeOf(b) - lifeOf(a) || (a.name || '').localeCompare(b.name || ''));
  const g = $('#grid'); g.innerHTML = '';
  $('#empty').style.display = list.length ? 'none' : '';
  list.forEach(f => g.append(card(f)));
  // selector para añadir: solo los del ranking que aún no están
  const sel = $('#newName'), have = new Set(state.followers.map(f => f.key));
  const opts = rank.filter(p => !have.has(p.key));
  sel.innerHTML = ''; sel.append(new Option(opts.length ? '— Añadir seguidor del ranking —' : (rank.length ? 'Ya están todos los del ranking' : 'Añade primero los nombres en el Ranking'), ''));
  opts.forEach(p => sel.append(new Option(p.name, p.key)));
}
function card(f){
  const life = lifeOf(f), max = state.maxLives, dead = life === 0, rp = rank.find(p => p.key === f.key);
  const el = document.createElement('article'); el.className = 'fcard' + (dead ? ' dead' : life <= 2 ? ' warn' : '');
  const top = document.createElement('div'); top.className = 'ftop';
  const av = document.createElement('div'); av.className = 'fav';
  if(rp && rp.avatar) av.style.backgroundImage = cssUrl(rp.avatar); else av.textContent = ((f.name || '?').trim()[0] || '?').toUpperCase();
  const nm = document.createElement('div'); nm.className = 'fname'; nm.textContent = (rp && rp.name) || f.name || 'Sin nombre';
  const wins = winsOf(f);
  const all = [...f.gifts.map(x => ({ ...x, lost: x.lost || dead })), ...wins.map(w => ({ ...w, lost: dead || f.lostWins.includes(w.id) }))];
  const act = all.filter(x => !x.lost).length;
  if(act){ const sm = document.createElement('small'); sm.textContent = '🎁 ' + act + (act === 1 ? ' regalo activo' : ' regalos activos'); nm.append(sm); }
  if(!rp && rank.length){ const sm = document.createElement('small'); sm.className = 'nork'; sm.textContent = 'Ya no está en el ranking'; nm.append(sm); }
  top.append(av, nm);
  // línea de fidelidad
  const lf = document.createElement('div'); lf.className = 'flife';
  const lbl = document.createElement('div'); lbl.className = 'lbl';
  lbl.innerHTML = '<span>Fidelidad</span><b></b>'; lbl.querySelector('b').textContent = dead ? '0 / ' + max : '❤ ' + life + ' / ' + max;
  const bar = document.createElement('div'); bar.className = 'fbar'; bar.style.setProperty('--lc', lifeColor(life, max));
  for(let i = 0; i < max; i++){ const sg = document.createElement('i'); if(i < life) sg.className = 'on'; bar.append(sg); }
  lf.append(lbl, bar);
  if(dead){ const d = document.createElement('div'); d.className = 'fdead'; d.textContent = '💀 Fidelidad perdida · regalos perdidos'; lf.append(d); }
  else if(life <= 2){ const d = document.createElement('div'); d.className = 'fdead'; d.style.color = '#ffb300'; d.textContent = life === 1 ? '⚠ Mañana pierde sus regalos' : '⚠ Pierde sus regalos en ' + life + ' días'; lf.append(d); }
  // regalos (los de la ruleta salen solos mientras no estén entregados)
  const gl = document.createElement('div'); gl.className = 'fgifts';
  all.forEach(x => {
    const c = document.createElement('span'); c.className = 'gift' + (x.lost ? ' lost' : '');
    c.title = (x.wheel ? 'Premio de la ruleta · ' : '') + (x.date ? 'desde ' + x.date.split('-').reverse().join('/') : '');
    c.textContent = ((x.emoji || '🎁') + ' ' + (x.text || '')).trim();
    if(x.wheel){ const t = document.createElement('span'); t.className = 'src'; t.textContent = '🎡'; c.append(t); }
    else { const del = document.createElement('button'); del.type = 'button'; del.className = 'x'; del.textContent = '✕'; del.title = 'Quitar regalo';
      del.onclick = () => { f.gifts = f.gifts.filter(y => y.id !== x.id); dirty = true; render(); }; c.append(del); }
    gl.append(c);
  });
  if(!all.length){ const n = document.createElement('span'); n.className = 'nogift'; n.textContent = 'Sin regalos todavía'; gl.append(n); }
  el.append(top, lf, gl);
  if(editing){
    // añadir regalo: premios de las ruletas u «Otro…»
    const ad = document.createElement('div'); ad.className = 'addg ed';
    const sel = document.createElement('select');
    sel.append(new Option('— Añadir regalo —', ''));
    ruleta.items.forEach((it, i) => sel.append(new Option((it.emoji ? it.emoji + ' ' : '') + it.text, String(i))));
    sel.append(new Option('✏️ Otro…', 'otro'));
    const tx = document.createElement('input'); tx.type = 'text'; tx.placeholder = 'Escribe el regalo (Enter)'; tx.style.display = 'none';
    const push = (emoji, text) => { if(!text) return; f.gifts.push({ id: newId(), emoji: emoji || '🎁', text, date: today(), lost: false }); dirty = true; render(); };
    sel.onchange = () => {
      if(sel.value === 'otro'){ sel.style.display = 'none'; tx.style.display = ''; tx.focus(); return; }
      const it = ruleta.items[+sel.value]; if(it) push(it.emoji, it.text);
    };
    tx.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); push('🎁', tx.value.trim()); } if(e.key === 'Escape') render(); };
    ad.append(sel, tx);
    const ctl = document.createElement('div'); ctl.className = 'fctl ed';
    const b = (t, title, fn, cls = '') => { const x = document.createElement('button'); x.type = 'button'; x.className = 'btn sm ' + cls; x.textContent = t; x.title = title; x.onclick = fn; ctl.append(x); return x; };
    b('−1', 'Quitar una vida', () => { setLives(f, life - 1); dirty = true; render(); });
    b('+1', 'Dar una vida', () => { setLives(f, life + 1); dirty = true; render(); });
    b('❤ Recargar', 'Llenar todas las vidas', () => { setLives(f, max); dirty = true; render(); }, 'primary');
    if(f.gifts.some(x => x.lost)) b('🧹 Perdidos', 'Borrar los regalos perdidos', () => { f.gifts = f.gifts.filter(x => !x.lost); dirty = true; render(); });
    const del = b('✕', 'Quitar de la lista de seguidores', () => {
      if(!del.dataset.armed){ del.dataset.armed = 1; del.textContent = '¿Seguro?'; setTimeout(() => { if(del.isConnected){ delete del.dataset.armed; del.textContent = '✕'; } }, 3000); return; }
      state.followers = state.followers.filter(y => y !== f); dirty = true; render();
    }, 'danger del');
    el.append(ad, ctl);
  }
  return el;
}

/* ---------- Edición (solo superadmin) ---------- */
function setEditing(on){
  editing = on; document.body.classList.toggle('editing', on);
  if(on){ $('#maxLives').value = state.maxLives; $('#edTitle').value = state.title || ''; $('#edSub').value = state.subtitle || ''; loadLinked(); }
  render();
}
$('#addF').onclick = () => {
  const k = $('#newName').value; if(!k) return $('#newName').focus();
  const p = rank.find(x => x.key === k); if(!p || state.followers.some(f => f.key === k)) return;
  state.followers.push({ key: k, name: p.name, lives: state.maxLives, base: today(), gifts: [], lostWins: [] });
  dirty = true; render();
};
$('#newName').onchange = () => $('#addF').click();
$('#maxLives').onchange = () => { state.maxLives = Math.max(1, Math.min(60, Math.round(+$('#maxLives').value || 7))); $('#maxLives').value = state.maxLives; dirty = true; render(); };
$('#edTitle').oninput = () => { state.title = $('#edTitle').value; dirty = true; $('#titleText').textContent = state.title || 'Seguidores'; };
$('#edSub').oninput = () => { state.subtitle = $('#edSub').value; dirty = true; $('#subtitleText').textContent = state.subtitle; };
$('#saveBtn').onclick = () => { state.title = (state.title || '').trim() || 'Seguidores'; save(); dirty = false; setEditing(false); };
addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- Login ---------- */
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => $('#' + b.dataset.close).classList.remove('show'));
$('#adminBtn').onclick = () => {
  if(editing){ if(dirty){ save(); dirty = false; } return setEditing(false); }
  if(sessionPwd) return setEditing(true);
  if(KAuth.can(PAGE)) return tryLogin(true);
  $('#pwd').value = ''; $('#loginErr').textContent = ''; $('#loginModal').classList.add('show'); setTimeout(() => $('#pwd').focus(), 50);
};
async function tryLogin(auto){
  auto = auto === true && KAuth.can(PAGE);
  const pwd = auto ? KAuth.pass() : $('#pwd').value; let ok = auto, why = '';
  if(!auto){
    $('#loginErr').textContent = 'Comprobando…';
    try{ const r = await KAuth.login(pwd, PAGE, state.password); ok = r.ok; why = r.msg || ''; KAuth.refresh(); }
    catch(e){ $('#loginErr').textContent = 'Error de conexión: ' + e.message; return; }
  }
  if(!ok){ $('#loginErr').textContent = /moderador/i.test(why) ? 'Los seguidores solo los edita el superadmin' : (why || 'Contraseña incorrecta'); return; }
  sessionPwd = pwd; $('#loginErr').textContent = ''; $('#loginModal').classList.remove('show');
  if(remoteEmpty){ remoteEmpty = false; save(); }
  setEditing(true);
}
$('#loginBtn').onclick = () => tryLogin();
$('#pwd').addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); tryLogin(); } });

/* ---------- Brasas ---------- */
const ec = $('#embers'), ex = ec.getContext('2d'); let parts = [];
const resize = () => { ec.width = innerWidth; ec.height = innerHeight; }; resize(); addEventListener('resize', resize);
(function loop(){
  ex.clearRect(0, 0, ec.width, ec.height);
  if(parts.length < 180 && Math.random() < .4) parts.push({ x: Math.random()*ec.width, y: ec.height+10, vx: (Math.random()-.5)*.6, vy: -(.6+Math.random()*1.6), life: 260+Math.random()*200, max: 460, size: 1+Math.random()*2.5, h: 15+Math.random()*30 });
  ex.globalCompositeOperation = 'lighter';
  parts = parts.filter(p => {
    p.x += p.vx + Math.sin(p.life*.05)*.3; p.y += p.vy; p.life--;
    const a = Math.max(0, p.life/p.max), gr = ex.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size*3);
    gr.addColorStop(0, `hsla(${p.h+20},100%,75%,${a})`); gr.addColorStop(.4, `hsla(${p.h},100%,50%,${a*.6})`); gr.addColorStop(1, 'hsla(0,100%,40%,0)');
    ex.fillStyle = gr; ex.beginPath(); ex.arc(p.x, p.y, p.size*3, 0, Math.PI*2); ex.fill();
    return p.life > 0;
  });
  ex.globalCompositeOperation = 'source-over';
  requestAnimationFrame(loop);
})();

render(); loadLinked();
// a medianoche cambia el día y cada minuto se miran los premios nuevos de la ruleta
setInterval(() => { if(!editing) loadLinked(); }, 60000);

if(KDB.enabled){
  const apply = d => { if(editing) return; const keep = { password: state.password }; state = { ...fromData(d), ...keep }; saveLocal(); render(); };
  KDB.load(PAGE).then(row => { if(row && row.data && Object.keys(row.data).length) apply(row.data); else remoteEmpty = true; }).catch(e => KDB.toast('⚠ ' + e.message, false));
  KDB.watch(PAGE, apply, () => editing || !!document.querySelector('.modal.show'));
}
})();
</script>
